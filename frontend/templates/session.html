<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Session | SCOE-Psychometrics</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 10%;
            border-bottom: 2px solid #000;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 100;
        }

        .timer {
            font-size: 1.5rem;
            font-weight: 700;
            background: #000;
            color: #fff;
            padding: 0.5rem 1.5rem;
        }

        /* ── Domain navigation ── */
        .domain-nav {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #000;
            overflow-x: auto;
            background: #fafafa;
        }

        .domain-btn {
            flex: 1;
            min-width: 160px;
            padding: 1rem 1.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            border-right: 1px solid #ddd;
            background: transparent;
            color: #555;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .domain-btn:last-child {
            border-right: none;
        }

        .domain-btn:hover {
            background: #f0f0f0;
            color: #000;
        }

        .domain-btn.active {
            background: #000;
            color: #fff;
        }

        .domain-btn .badge {
            display: inline-block;
            margin-left: 6px;
            background: rgba(255, 255, 255, 0.25);
            color: inherit;
            border-radius: 999px;
            font-size: 0.75rem;
            padding: 1px 7px;
        }

        .domain-btn:not(.active) .badge {
            background: #e0e0e0;
            color: #555;
        }

        /* ── Progress bar ── */
        .domain-progress {
            height: 4px;
            background: #eee;
        }

        .domain-progress-fill {
            height: 100%;
            background: #000;
            transition: width 0.4s ease;
            width: 0%;
        }

        /* ── Question cards ── */
        .question-container {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .domain-panel {
            display: none;
        }

        .domain-panel.active {
            display: block;
        }

        .domain-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #000;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .question-card {
            margin-bottom: 3rem;
            padding: 2rem;
            border: 1px solid #ddd;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease-out;
            background: #fff;
        }

        .question-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .question-number {
            font-size: 0.8rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
        }

        /* ── Likert Scale (7-point) ── */
        .likert-scale {
            margin-top: 1.5rem;
        }

        .likert-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #555;
            margin-bottom: 1rem;
            padding: 0 10px;
        }

        .likert-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.4rem;
        }

        .likert-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            cursor: pointer;
        }

        .likert-option input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #ccc;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
            position: relative;
        }

        .likert-option input[type="radio"]:hover {
            border-color: #000;
            transform: scale(1.1);
        }

        .likert-option input[type="radio"]:checked {
            background: #000;
            border-color: #000;
        }

        .likert-option-label {
            font-size: 0.65rem;
            color: #888;
            font-weight: 500;
            text-align: center;
            max-width: 60px;
            line-height: 1.2;
        }

        /* ── Navigation footer ── */
        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto 6rem;
            padding: 0 2rem;
            gap: 1rem;
        }

        .btn-outline {
            padding: 1rem 2.5rem;
            border: 2px solid #000;
            background: transparent;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn-outline:hover {
            background: #000;
            color: #fff;
        }

        .btn-outline:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        #final-submit {
            background: #000;
            color: #fff;
            padding: 1rem 3rem;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        #final-submit:hover {
            background: #333;
        }
    </style>
</head>

<body>
    <div class="session-header">
        <div class="logo-container">
            <img src="/static/img/SCOE_logo.png" alt="Logo" class="nav-logo">
            <span class="logo">ScoePsychometrics</span>
        </div>
        <div id="timer" class="timer">120:00</div>
    </div>

    <!-- Domain tabs -->
    <nav class="domain-nav" id="domain-nav"></nav>

    <div class="domain-progress">
        <div class="domain-progress-fill" id="progress-fill"></div>
    </div>

    <!-- Question panels -->
    <div id="panels-container"></div>

    <div class="nav-footer">
        <button class="btn-outline" id="btn-prev" onclick="changeDomain(-1)" disabled>&#8592; Previous</button>
        <button id="final-submit" style="display:none" onclick="submitExam()">Submit Examination</button>
        <button class="btn-outline" id="btn-next" onclick="changeDomain(1)">Next &#8594;</button>
    </div>

    <script>
        let currentDomainIndex = 0;
        let domainList = [];
        let questionsByDomain = {};
        let allQuestions = [];

        const domainNav = document.getElementById('domain-nav');
        const panelsContainer = document.getElementById('panels-container');
        const progressFill = document.getElementById('progress-fill');

        async function loadData() {
            if (window.location.protocol === 'file:') {
                alert("Error: This page must be served through the FastAPI server (e.g., http://localhost:8000/session) to load questions. Please do not open the HTML file directly.");
                return;
            }
            try {
                console.log("Fetching questions from /questions...");
                const res = await fetch('/questions');
                if (!res.ok) {
                    const errorText = await res.text();
                    console.error("Fetch failed:", res.status, errorText);
                    alert(`Failed to load questions from server (Status: ${res.status}). See console for details.`);
                    throw new Error(`Failed to fetch questions: ${res.status} ${res.statusText}`);
                }
                allQuestions = await res.json();
                console.log("Questions loaded:", allQuestions.length);
                
                if (allQuestions.length === 0) {
                    console.warn("No questions found in database.");
                    panelsContainer.innerHTML = '<p style="text-align:center;padding:5rem;color:#888;">No questions found in the database. Please seed the database first by running <code>python backend/seed_mbti.py</code>.</p>';
                    return;
                }

                // Group questions by category (domain)
                questionsByDomain = {};
                domainList = [];
                allQuestions.forEach(q => {
                    const domain = (q.category || "General").toUpperCase();
                    if (!questionsByDomain[domain]) {
                        questionsByDomain[domain] = [];
                        domainList.push(domain);
                    }
                    questionsByDomain[domain].push(q);
                });

                renderStructure();
                updateNav();
            } catch (err) {
                console.error("loadData Error:", err);
                panelsContainer.innerHTML = `<p style="color:red;text-align:center;padding:5rem;">Error loading questions: ${err.message}<br><br>Check if the backend server is running and the database is connected.</p>`;
            }
        }

        function renderStructure() {
            domainNav.innerHTML = '';
            panelsContainer.innerHTML = '';

            domainList.forEach((domain, di) => {
                // Tab button
                const btn = document.createElement('button');
                btn.className = 'domain-btn' + (di === 0 ? ' active' : '');
                btn.id = `tab-${di}`;
                btn.onclick = () => goToDomain(di);
                btn.innerHTML = `${domain} <span class="badge" id="badge-${di}">${questionsByDomain[domain].length}</span>`;
                domainNav.appendChild(btn);

                // Panel
                const panel = document.createElement('div');
                panel.className = 'domain-panel question-container' + (di === 0 ? ' active' : '');
                panel.id = `panel-${di}`;
                
                let questionsHtml = '';
                questionsByDomain[domain].forEach((q, qi) => {
                    const opts = Object.keys(q.options).sort();
                    const isLikert = opts.length >= 5; // Assume Likert for 5+ options

                    let inputHtml = '';
                    if (isLikert) {
                        inputHtml = `
                            <div class="likert-scale">
                                <div class="likert-header">
                                    <span>Disagree</span>
                                    <span>Neutral</span>
                                    <span>Agree</span>
                                </div>
                                <div class="likert-options">
                                    ${opts.map((key, idx) => `
                                        <label class="likert-option" title="${q.options[key]}">
                                            <input type="radio" name="q${q.id}" value="${key}" required>
                                            <span class="likert-option-num" style="font-size:0.75rem;font-weight:700;margin-top:0.3rem;">${idx + 1}</span>
                                            <span class="likert-option-label" style="display:none;">${q.options[key]}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    } else {
                        inputHtml = `
                            <div class="options-grid">
                                ${opts.map(key => `
                                    <label class="option-label">
                                        <input type="radio" name="q${q.id}" value="${key}" required>
                                        <span><strong>${key}.</strong> ${q.options[key]}</span>
                                    </label>
                                `).join('')}
                            </div>
                        `;
                    }

                    questionsHtml += `
                        <div class="question-card reveal">
                            <div class="question-number">Question ${qi + 1} of ${questionsByDomain[domain].length}</div>
                            <div class="question-text">${q.text}</div>
                            ${inputHtml}
                        </div>
                    `;
                });

                panel.innerHTML = `
                    <div class="domain-title">${domain}</div>
                    ${questionsHtml}
                `;
                panelsContainer.appendChild(panel);
            });

            // Intersection Observer for fade-in
            const observer = new IntersectionObserver(entries => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.question-card').forEach(c => observer.observe(c));
        }

        function goToDomain(index) {
            document.getElementById(`panel-${currentDomainIndex}`).classList.remove('active');
            document.getElementById(`tab-${currentDomainIndex}`).classList.remove('active');
            currentDomainIndex = index;
            document.getElementById(`panel-${currentDomainIndex}`).classList.add('active');
            document.getElementById(`tab-${currentDomainIndex}`).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateNav();
        }

        function changeDomain(dir) { 
            const next = currentDomainIndex + dir;
            if (next >= 0 && next < domainList.length) goToDomain(next); 
        }

        function updateNav() {
            const progress = ((currentDomainIndex + 1) / domainList.length) * 100;
            progressFill.style.width = `${progress}%`;

            document.getElementById('btn-prev').disabled = currentDomainIndex === 0;
            const isLast = currentDomainIndex === domainList.length - 1;
            document.getElementById('btn-next').style.display = isLast ? 'none' : 'inline-block';
            document.getElementById('final-submit').style.display = isLast ? 'inline-block' : 'none';
        }

        async function submitExam() {
            const responses = [];
            let unanswered = 0;

            allQuestions.forEach(q => {
                const checked = document.querySelector(`input[name="q${q.id}"]:checked`);
                if (checked) {
                    responses.push({
                        question_id: q.id,
                        selected_option: checked.value
                    });
                } else {
                    unanswered++;
                }
            });

            if (unanswered > 0) {
                if (!confirm(`You have ${unanswered} unanswered questions. Submit anyway?`)) return;
            }

            const name = prompt("Enter your Full Name:") || "Anonymous Student";
            const email = prompt("Enter your Email:") || `user_${Date.now()}@example.com`;

            const payload = {
                student_name: name,
                email: email,
                responses: responses
            };

            try {
                const btn = document.getElementById('final-submit');
                btn.disabled = true;
                btn.textContent = 'Submitting...';

                const res = await fetch('/submit-exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if (data.status === 'success') {
                    alert("Exam submitted successfully!");
                    window.location.href = `/report?id=${data.report_id}`;
                } else {
                    throw new Error(data.detail || "Submission failed");
                }
            } catch (err) {
                alert("Error: " + err.message);
                const btn = document.getElementById('final-submit');
                btn.disabled = false;
                btn.textContent = 'Submit Examination';
            }
        }

        // Timer (Optional but helpful)
        let timeLeft = 120 * 60;
        setInterval(() => {
            if (timeLeft <= 0) return;
            timeLeft--;
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2, '0')}`;
        }, 1000);

        loadData();
    </script>
</body>

</html>
