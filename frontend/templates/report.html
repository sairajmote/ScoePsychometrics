<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychometric Report | ScoePsychometrics</title>
    <meta name="description"
        content="Comprehensive psychometric assessment report with personality, intelligence, and behavioral analysis.">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        /* ── Color Palette ── */
        :root {
            --c-green: #2ecc71;
            --c-red: #e74c3c;
            --c-blue: #3498db;
            --c-yellow: #f1c40f;
            --c-purple: #9b59b6;
            --c-orange: #e67e22;
            --c-teal: #1abc9c;
            --c-green-light: rgba(46, 204, 113, 0.12);
            --c-blue-light: rgba(52, 152, 219, 0.12);
            --c-red-light: rgba(231, 76, 60, 0.12);
            --c-yellow-light: rgba(241, 196, 15, 0.12);
        }

        /* ── Tabs Navigation ── */
        .report-tabs {
            max-width: 1100px;
            margin: 0 auto 2rem auto;
            padding: 0 1rem;
            display: flex;

            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: #f1f1f1;
            border: 2px solid #eee;
            padding: 1rem 1.8rem;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #2a2424;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .tab-btn:hover {
            border-color: #000;
            color: #000;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: #000;
            border-color: #000;
            color: #fff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        /* ── Tab Content & Animations ── */
        .results-container {
            position: relative;
            min-height: 0;
        }

        .tab-content {
            display: none;
            opacity: 0;
            transform-origin: var(--origin-x, center) var(--origin-y, 0px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            animation: expandFromTab 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes expandFromTab {
            0% {
                opacity: 0;
                transform: scale(0.1);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @media print {
            @page {
                size: A4;
                margin: 15mm;
            }

            /* Hide everything that isn't report content */
            header,
            nav,
            .section-nav,
            .report-tabs,
            .print-btn,
            .report-footer-bar button {
                display: none !important;
            }

            body {
                background: #fff !important;
                color: #000 !important;
                padding-top: 0 !important;
                margin: 0 !important;
                font-size: 11pt !important;
            }

            .report-shell {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }

            .results-container {
                min-height: auto !important;
                display: block !important;
            }

            /* Force all sections to show in print */
            .tab-content {
                display: block !important;
                opacity: 1 !important;
                visibility: visible !important;
                position: static !important;
                transform: none !important;
                animation: none !important;
                width: 100% !important;
                margin-bottom: 2rem !important;
            }

            /* Smart Page Breaks */
            #tab-mbti,
            #tab-temperament,
            #tab-big5,
            #tab-mi,
            #tab-enneagram,
            #tab-brain,
            #sec-insights {
                page-break-before: always !important;
                break-before: page !important;
                padding-top: 1cm !important;
            }

            .section-block {
                margin: 0 0 2cm 0 !important;
                padding: 0 !important;
                border: none !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /* Keep cards and boxes together */
            .career-path-card,
            .compat-card,
            .b5-trait,
            .mi-card,
            .snap-card,
            .cog-card,
            .interp-box,
            .mbti-type-display {
                page-break-inside: avoid !important;
                break-inside: avoid-page !important;
                margin-bottom: 1rem !important;
            }

            /* Visual Integrity */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .insights-block {
                background: transparent !important;
                color: #000 !important;
                padding: 0 !important;
                margin-top: 2cm !important;
                page-break-before: always !important;
                break-before: page !important;
            }

            .insights-block h2,
            .insights-block h3,
            .insight-col li,
            .insights-summary,
            .career-path-name,
            .career-path-reason,
            .compat-label,
            .compat-value {
                color: #000 !important;
            }

            .career-path-card,
            .compat-card {
                border: 1px solid #ddd !important;
                background: #f9f9f9 !important;
            }

            .insight-col h3 {
                border-bottom: 1px solid #ddd !important;
            }

            .report-cover {
                border: 2px solid #000 !important;
                padding: 2rem !important;
                margin-bottom: 2rem !important;
                page-break-after: always !important;
                break-after: page !important;
            }

            /* Normalize elements */
            .snapshot-grid,
            .mi-grid,
            .career-paths-grid,
            .compat-grid {
                display: grid !important;
                gap: 1rem !important;
            }

            .cover-title {
                font-size: 2.5rem !important;
                margin-top: 1rem !important;
            }

            h2 {
                font-size: 1.6rem !important;
            }

            h3 {
                font-size: 1.2rem !important;
            }

            .report-footer-bar {
                background: #000 !important;
                color: #fff !important;
                position: static !important;
                margin-top: 2rem !important;
            }
        }

        /* ── AI Summary Box ── */
        .ai-summary-box {
            background: #fff;
            border: 1px solid #eee;
            padding: 2.5rem;
            margin: 2rem 0;
            position: relative;
        }

        .ai-summary-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #222;
        }

        /* ── Report Shell ── */
        .report-shell {
            max-width: 1100px;
            margin: 120px auto 5rem auto;
            padding: 0 2rem;
        }

        /* ── Cover Header ── */
        .report-cover {
            border: 3px solid #000;
            padding: 4rem 3.5rem;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
            background: #fff;
        }

        .cover-badge {
            display: inline-block;
            background: var(--c-teal);
            color: #fff;
            padding: 0.45rem 1.4rem;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 2rem;
        }

        .cover-title {
            font-size: 4.8rem;
            line-height: 1;
            font-weight: 950;
            margin-bottom: 1.5rem;
            letter-spacing: -0.04em;
            color: #000;
            text-transform: uppercase;
        }

        .cover-meta {
            display: flex;
            gap: 3rem;
            flex-wrap: wrap;
            margin-top: 3.5rem;
            padding-top: 2.5rem;
            border-top: 2px solid #eee;
        }

        .cover-meta-item {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .cover-meta-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 800;
            color: #999;
        }

        .cover-meta-value {
            font-size: 1.25rem;
            font-weight: 900;
            color: #000;
        }

        /* ── Snapshot Grid ── */
        .snapshot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.2rem;
            margin-bottom: 3.5rem;
        }

        .snap-card {
            background: #f9f9f9;
            padding: 1.5rem;
            border: 1px solid #eee;
            transition: transform 0.3s;
        }

        .snap-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 800;
            color: #888;
            margin-bottom: 0.8rem;
        }

        .snap-value {
            font-size: 2.2rem;
            font-weight: 900;
            color: #000;
            line-height: 1;
            margin-bottom: 0.4rem;
        }

        .snap-sub {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--c-teal);
        }

        /* ── Section Blocks ── */
        .section-block {
            margin-bottom: 4rem;
            background: #fff;
            border: 1px solid #eee;
            padding: 3rem;
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .section-num {
            font-size: 1rem;
            font-weight: 900;
            background: #000;
            color: #fff;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-heading h2 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.01em;
        }

        .section-desc {
            font-size: 1.05rem;
            color: #666;
            margin-bottom: 2.5rem;
            max-width: 800px;
            line-height: 1.6;
        }

        /* ── MBTI Specific ── */
        .mbti-type-display {
            text-align: center;
            margin-bottom: 3rem;
            padding: 3rem;
            background: #f0fcf9;
            border: 1px solid #d1f2eb;
        }

        .mbti-type-code {
            font-size: 5rem;
            font-weight: 950;
            letter-spacing: -0.05em;
            color: #000;
            line-height: 1;
        }

        .mbti-type-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--c-teal);
            margin-top: 0.5rem;
        }

        .dichotomy-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.2rem;
        }

        .dich-label {
            width: 150px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .dich-label-right {
            width: 150px;
            text-align: right;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .dich-bar-wrap {
            flex: 1;
            height: 28px;
            background: #eee;
            display: flex;
            position: relative;
        }

        .dich-bar-a {
            background: var(--c-teal);
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 10px;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 800;
            transition: width 1s;
        }

        .dich-bar-b {
            background: #eee;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: #888;
            font-size: 0.7rem;
            font-weight: 800;
            flex: 1;
        }

        .interp-box {
            background: #f8f9fa;
            border-left: 4px solid var(--c-teal);
            padding: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #444;
            margin-top: 2rem;
        }

        .interp-box strong {
            display: block;
            margin-bottom: 0.5rem;
            color: #000;
            font-size: 1rem;
        }

        /* ── Insights Block ── */
        .insights-block {
            background: #000;
            color: #fff;
            padding: 4rem 3rem;
            margin-bottom: 5rem;
        }

        .insights-block h2 {
            font-size: 2.5rem;
            font-weight: 850;
            margin-bottom: 1.5rem;
        }

        .insights-summary {
            font-size: 1.2rem;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 3rem;
            max-width: 900px;
            white-space: pre-wrap;
        }

        .insights-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        .insight-col h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .insight-col ul {
            list-style: none;
            padding: 0;
        }

        .insight-col li {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .insight-col li::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--c-teal);
        }

        .career-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 2rem;
        }

        .career-tag {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .career-paths-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .career-path-card {
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 1.2rem 1.4rem;
            background: rgba(255, 255, 255, 0.04);
        }

        .career-path-name {
            font-size: 0.9rem;
            font-weight: 800;
            color: #1abc9c;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .career-path-reason {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.6;
        }

        .compat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .compat-card {
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 1.2rem;
        }

        .compat-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #aaa;
            margin-bottom: 0.5rem;
        }

        .compat-value {
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* ── Footer ── */
        .report-footer-bar {
            background: #000;
            color: #fff;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .print-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 0.6rem 1.2rem;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* ── Big Five Traits ── */
        .b5-section {
            margin-bottom: 4rem;
            background: #fff;
            border: 1px solid #eee;
            padding: 3rem;
        }

        .b5-trait-list {
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
            margin-top: 2rem;
        }

        .b5-trait {
            display: grid;
            grid-template-columns: 200px 1fr 60px;
            align-items: center;
            gap: 1.2rem;
        }

        .b5-trait-name {
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #333;
        }

        .b5-trait-subname {
            display: block;
            font-size: 0.68rem;
            font-weight: 500;
            color: #999;
            text-transform: none;
            letter-spacing: 0;
            margin-top: 2px;
        }

        .b5-bar-wrap {
            height: 12px;
            background: #f0f0f0;
            border-radius: 6px;
            overflow: hidden;
        }

        .b5-bar-fill {
            height: 100%;
            border-radius: 6px;
            width: 0%;
            transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .b5-bar-fill.openness {
            background: linear-gradient(90deg, #6C63FF, #9B8FFF);
        }

        .b5-bar-fill.neuroticism {
            background: linear-gradient(90deg, #e74c3c, #ff7675);
        }

        .b5-bar-fill.agreeableness {
            background: linear-gradient(90deg, #1abc9c, #55efc4);
        }

        .b5-bar-fill.extraversion {
            background: linear-gradient(90deg, #f39c12, #fdcb6e);
        }

        .b5-bar-fill.conscientiousness {
            background: linear-gradient(90deg, #3498db, #74b9ff);
        }

        .b5-pct {
            font-size: 0.85rem;
            font-weight: 800;
            color: #000;
            text-align: right;
        }

        .b5-descriptor {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.2rem 0.6rem;
            border-radius: 3px;
            margin-left: 0;
            display: inline-block;
            margin-top: 4px;
        }

        .desc-very_low {
            background: #ffeaa7;
            color: #856404;
        }

        .desc-low {
            background: #dfe6e9;
            color: #636e72;
        }

        .desc-moderate {
            background: #d1f2eb;
            color: #0e6655;
        }

        .desc-high {
            background: #d6eaf8;
            color: #1a5276;
        }

        .desc-very_high {
            background: #d5f5e3;
            color: #1e8449;
        }

        .b5-desc-text {
            font-size: 0.82rem;
            color: #666;
            line-height: 1.5;
            margin-top: 0.4rem;
        }

        .b5-profile-summary {
            background: #f8f9fa;
            border-left: 4px solid #6C63FF;
            padding: 1.4rem 1.6rem;
            font-size: 0.95rem;
            line-height: 1.65;
            color: #444;
            margin-bottom: 2rem;
        }

        /* ── Multiple Intelligence ── */
        .mi-section {
            margin-bottom: 4rem;
            background: #fff;
            border: 1px solid #eee;
            padding: 3rem;
        }

        .mi-dominant-banner {
            background: linear-gradient(135deg, #6C63FF 0%, #3498db 100%);
            color: #fff;
            border-radius: 6px;
            padding: 1.6rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .mi-dominant-icon {
            font-size: 2.4rem;
            line-height: 1;
        }

        .mi-dominant-text h3 {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0 0 0.3rem;
            letter-spacing: -0.01em;
        }

        .mi-dominant-text p {
            font-size: 0.88rem;
            opacity: 0.9;
            margin: 0;
            line-height: 1.5;
        }

        .mi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.4rem;
            margin-top: 1.5rem;
        }

        .mi-card {
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 1.2rem 1.4rem;
            background: #fafafa;
            transition: box-shadow 0.2s;
        }

        .mi-card:hover {
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .mi-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .mi-card-label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #333;
        }

        .mi-card-pct {
            font-size: 1rem;
            font-weight: 900;
            color: #000;
        }

        .mi-bar-wrap {
            height: 8px;
            background: #ececec;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .mi-bar-fill {
            height: 100%;
            border-radius: 4px;
            width: 0%;
            transition: width 1.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Per-intelligence colour palette */
        .mi-bar-fill.LI {
            background: linear-gradient(90deg, #e17055, #fab1a0);
        }

        .mi-bar-fill.LMI {
            background: linear-gradient(90deg, #6C63FF, #a29bfe);
        }

        .mi-bar-fill.MI {
            background: linear-gradient(90deg, #fd79a8, #fdcfe8);
        }

        .mi-bar-fill.BKI {
            background: linear-gradient(90deg, #00b894, #55efc4);
        }

        .mi-bar-fill.SVI {
            background: linear-gradient(90deg, #0984e3, #74b9ff);
        }

        .mi-bar-fill.IPI {
            background: linear-gradient(90deg, #e67e22, #f9ca24);
        }

        .mi-bar-fill.INPI {
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
        }

        .mi-bar-fill.NI {
            background: linear-gradient(90deg, #27ae60, #6fcf97);
        }

        .mi-bar-fill.EI {
            background: linear-gradient(90deg, #636e72, #b2bec3);
        }

        .mi-card-desc {
            font-size: 0.78rem;
            color: #666;
            line-height: 1.5;
        }

        .mi-profile-summary {
            background: #f8f9fa;
            border-left: 4px solid #6C63FF;
            padding: 1.2rem 1.5rem;
            font-size: 0.95rem;
            line-height: 1.65;
            color: #444;
            margin-bottom: 2rem;
        }

        @media print {

            .section-nav,
            .report-footer-bar,
            .print-btn {
                display: none !important;
            }

            .report-shell {
                margin: 0;
                padding: 0;
                max-width: 100%;
            }

            body {
                background: white;
            }
        }

        /* Report Lookup Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 500px;
            padding: 1.25rem;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: popIn 0.3s ease;
        }

        .modal-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 50%;
            cursor: pointer;
            color: #888;
            font-size: 1.5rem;
            line-height: 1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .modal-close:hover {
            background: #f5f5f5;
            color: #000;
            border-color: #eee;
            transform: rotate(90deg);
        }

        .modal-close:active {
            transform: rotate(90deg) scale(0.9);
        }

        @keyframes popIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .report-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border: 1px solid #eee;
            text-decoration: none;
            color: #000;
            transition: border-color 0.2s;
            margin-bottom: 0.5rem;
        }

        .report-item:hover {
            border-color: #000;
        }

        .ri-id {
            font-weight: 700;
            font-size: 1rem;
        }

        .ri-date {
            font-size: 0.8rem;
            color: #666;
        }

        /* Custom scrollbar for Webkit */
        #lookupResults::-webkit-scrollbar {
            width: 4px;
        }

        #lookupResults::-webkit-scrollbar-track {
            background: #f9f9f9;
        }

        #lookupResults::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-container">
            <img src="/static/img/SCOE_logo.png" alt="ScoePsychometrics Logo" class="nav-logo">
            <span class="logo">ScoePsychometrics</span>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/exam">Exam</a></li>
                <li><a href="#" onclick="openReportModal(event)">View Your Report</a></li>
            </ul>
        </nav>
    </header>

    <div class="section-nav" id="section-nav">
        <a href="#sec-overview" class="nav-active">Overview</a>
        <a href="#sec-results">Results</a>
        <a href="#sec-big5">Big Five</a>
        <a href="#sec-mi">Multiple Intelligence</a>
        <a href="#sec-insights">Insights</a>
    </div>

    <main class="report-shell" id="report-root">
        <div style="text-align:center;padding:5rem;">
            <p>Loading report data...</p>
        </div>
    </main>

    <script>
        async function loadReport() {
            const urlParams = new URLSearchParams(window.location.search);
            const reportId = urlParams.get('report_id') || urlParams.get('id');

            // Grab temperament result if passed from the exam submission
            window._temperamentType = urlParams.get('temperament') || '';
            window._temperamentDesc = urlParams.get('temperament_desc') || '';

            if (!reportId) {
                const res = await fetch('/static/data/sample_report_data.json');
                const data = await res.json();
                renderReport(data);
                return;
            }

            try {
                const res = await fetch(`/api/report/${reportId}`);
                if (!res.ok) throw new Error("Report not found");
                const data = await res.json();
                renderReport(data);
            } catch (err) {
                document.getElementById('report-root').innerHTML = `
                    <div style="text-align:center;padding:4rem;">
                        <h2 style="color:#e74c3c;">Report Not Found</h2>
                        <a href="/">Return to Home</a>
                    </div>
                `;
            }
        }

        function formatDuration(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}m ${s}s`;
        }

        window.switchTab = function (tabId, event) {
            const btn = event.currentTarget;
            const container = document.querySelector('.results-container');
            const target = document.getElementById(tabId);

            if (!target || !container) return;

            // 1. Calculate transformation origin from the clicked button
            const btnRect = btn.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();

            const originX = (btnRect.left + btnRect.width / 2) - containerRect.left;
            const originY = (btnRect.top + btnRect.height / 2) - containerRect.top;

            container.style.setProperty('--origin-x', `${originX}px`);
            container.style.setProperty('--origin-y', `${originY}px`);

            // 2. Manage Active States
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(c => {
                c.classList.remove('active');
                c.style.display = 'none';
            });

            target.style.display = 'block';
            // Force reflow for animation
            void target.offsetWidth;
            target.classList.add('active');

            // 3. Scroll container into view center so the "pop" is visible
            setTimeout(() => {
                container.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            }, 10);

            // 4. Re-trigger bar animations and charts
            setTimeout(() => {
                document.querySelectorAll('.b5-bar-fill').forEach(bar => {
                    const target = bar.getAttribute('data-width');
                    if (target) bar.style.width = target + '%';
                });
                document.querySelectorAll('.mi-bar-fill').forEach(bar => {
                    const target = bar.getAttribute('data-mi-width');
                    if (target) bar.style.width = target + '%';
                });

                if (target.id === 'tab-enneagram' && window.initEnneagramChart) {
                    window.initEnneagramChart();
                }
            }, 100);
        };

        function renderReport(D) {
            const root = document.getElementById('report-root');
            const meta = D.meta;
            const sub = D.subtests;
            const insights = D.composite_insights;

            let html = '';
            let tabsHtml = '';

            // ── COVER ──
            html += `
                <div class="report-cover" id="sec-overview">
                    <div class="cover-badge">Psychometric Assessment Report</div>
                    <h1 class="cover-title">HI, ${meta.candidate.name.toUpperCase()}</h1>
                    
                    ${insights.ai_overview ? `
                    <div class="ai-summary-box">
                        <div class="overview-label" style="font-size:1rem;font-weight:950;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:1rem;color:#000;">Overview</div>
                        <div class="ai-summary-text">${insights.ai_overview}</div>
                    </div>` : ''}

                    <div class="cover-meta">
                        <div class="cover-meta-item">
                            <span class="cover-meta-label">Report ID</span>
                            <span class="cover-meta-value">${meta.report_id}</span>
                        </div>
                        <div class="cover-meta-item">
                            <span class="cover-meta-label">Generated</span>
                            <span class="cover-meta-value">${new Date(meta.generated_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
                        </div>
                        <div class="cover-meta-item">
                            <span class="cover-meta-label">Education</span>
                            <span class="cover-meta-value">${meta.candidate.education || 'Not Specified'}</span>
                        </div>
                    </div>
                </div>`;

            html += `
                <div class="report-tabs">
                    ${sub.mbti ? `<button class="tab-btn" onclick="switchTab('tab-mbti', event)">IDENTITY (MBTI)</button>` : ''}
                    ${sub.temperament ? `<button class="tab-btn" onclick="switchTab('tab-temperament', event)">CORE TEMPERAMENT</button>` : ''}
                    ${sub.big5 ? `<button class="tab-btn" onclick="switchTab('tab-big5', event)">TRAITS (BIG 5)</button>` : ''}
                    ${sub.multiple_intelligence ? `<button class="tab-btn" onclick="switchTab('tab-mi', event)">INTELLIGENCE (MI)</button>` : ''}
                    ${sub.enneagram ? `<button class="tab-btn" onclick="switchTab('tab-enneagram', event)">MOTIVATIONS (ENNEA)</button>` : ''}
                    ${sub.brain_dominance ? `<button class="tab-btn" onclick="switchTab('tab-brain', event)">COGNITIVE STYLE</button>` : ''}
                </div>
                
                <div class="results-container">`;

            // ── MBTI SECTION ──
            if (sub.mbti) {
                const mbti = sub.mbti;
                const tempType = window._temperamentType;
                const tempDesc = window._temperamentDesc;

                const temperamentCard = tempType ? `
                    <div class="snap-card" style="background:#000;color:#fff;border:none;">
                        <div class="snap-label" style="color:#888;">Temperament</div>
                        <div class="snap-value" style="color:#fff;font-size:1.8rem;">${tempType.toUpperCase()}</div>
                        <div class="snap-sub" style="color:#aaa;font-weight:500;font-size:0.8rem;font-style:italic;margin-top:0.4rem;">${tempDesc}</div>
                    </div>` : '';

                const dichRows = Object.values(mbti.dichotomies).map(d => `
                    <div class="dichotomy-row">
                        <div class="dich-label">${d.dimension_a.label} (${d.dimension_a.code})</div>
                        <div class="dich-bar-wrap">
                            <div class="dich-bar-a" style="width:${d.dimension_a.score}%">${Math.round(d.dimension_a.score)}%</div>
                            <div class="dich-bar-b" style="width:${d.dimension_b.score}%">${Math.round(d.dimension_b.score)}%</div>
                        </div>
                        <div class="dich-label-right">${d.dimension_b.label} (${d.dimension_b.code})</div>
                    </div>
                `).join('');

                html += `
                <div id="tab-mbti" class="tab-content">
                    <div class="snapshot-grid">
                        <div class="snap-card">
                            <div class="snap-label">MBTI Type</div>
                            <div class="snap-value">${mbti.result_type}</div>
                            <div class="snap-sub">${mbti.type_label}</div>
                        </div>
                        ${temperamentCard}
                    </div>
                    <div class="section-block">
                        <div class="section-heading">
                            <span class="section-num">01</span>
                            <h2>${mbti.label}</h2>
                        </div>
                        <div class="section-desc">${mbti.description}</div>
                        <div class="section-body">
                            <div class="mbti-type-display">
                                <div class="mbti-type-code">${mbti.result_type}</div>
                                <div class="mbti-type-name">${mbti.type_label}</div>
                            </div>
                            ${dichRows}
                            <div class="interp-box">
                                <strong>Interpretation</strong>
                                ${mbti.interpretation}
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            // ── TEMPERAMENT SECTION ──
            if (sub.temperament) {
                const temp = sub.temperament;
                const ePct = (temp.e_score / temp.e_max) * 100;
                const nPct = (temp.n_score / temp.n_max) * 100;

                html += `
                <div id="tab-temperament" class="tab-content">
                    <div class="section-block">
                        <div class="section-heading"><span class="section-num">1.5</span><h2>${temp.label}</h2></div>
                        <div class="section-desc">${temp.description}</div>
                        <div class="section-body">
                            <div style="display:flex; justify-content:center; margin-bottom:3rem;">
                                <div style="background:#000; color:#fff; padding:3rem 5rem; text-align:center; border-radius:4px;">
                                    <div style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.2em; color:#888; margin-bottom:0.5rem;">Resulting Type</div>
                                    <div style="font-size:3.5rem; font-weight:900; letter-spacing:-0.03em;">${temp.result_type.toUpperCase()}</div>
                                    <div style="font-size:1.1rem; color:#aaa; margin-top:0.5rem; font-style:italic;">"${temp.interpretation}"</div>
                                </div>
                            </div>

                            <div style="max-width:700px; margin:0 auto;">
                                <div style="margin-bottom:2rem;">
                                    <div style="display:flex; justify-content:space-between; margin-bottom:0.6rem; font-weight:800; font-size:0.85rem; text-transform:uppercase; color:#444;">
                                        <span>Extraversion (E)</span>
                                        <span>${temp.e_score} / ${temp.e_max}</span>
                                    </div>
                                    <div style="height:12px; background:#f0f0f0; border-radius:999px; overflow:hidden;">
                                        <div style="width:${ePct}%; height:100%; background:linear-gradient(90deg, #3498db, #2980b9); border-radius:999px;"></div>
                                    </div>
                                </div>

                                <div style="margin-bottom:2rem;">
                                    <div style="display:flex; justify-content:space-between; margin-bottom:0.6rem; font-weight:800; font-size:0.85rem; text-transform:uppercase; color:#444;">
                                        <span>Neuroticism (N)</span>
                                        <span>${temp.n_score} / ${temp.n_max}</span>
                                    </div>
                                    <div style="height:12px; background:#f0f0f0; border-radius:999px; overflow:hidden;">
                                        <div style="width:${nPct}%; height:100%; background:linear-gradient(90deg, #e74c3c, #c0392b); border-radius:999px;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            // ── BIG FIVE SECTION ──
            if (sub.big5) {
                const b5 = sub.big5;
                const descriptorClass = {
                    'Very Low': 'desc-very_low', 'Low': 'desc-low', 'Moderate': 'desc-moderate', 'High': 'desc-high', 'Very High': 'desc-very_high'
                };
                const traitOrder = ['openness', 'conscientiousness', 'extraversion', 'agreeableness', 'neuroticism'];
                const traitsHtml = traitOrder.map(key => {
                    if (!b5.traits || !b5.traits[key]) return '';
                    const t = b5.traits[key];
                    const pct = t.score_pct || 0;
                    const dc = descriptorClass[t.descriptor] || 'desc-moderate';
                    return `
                        <div class="b5-trait">
                            <div class="b5-trait-name">${t.label} <span class="b5-descriptor ${dc}">${t.descriptor}</span></div>
                            <div>
                                <div class="b5-bar-wrap"><div class="b5-bar-fill ${key}" data-width="${pct}" style="width:0%"></div></div>
                                <div class="b5-desc-text">${t.description}</div>
                            </div>
                            <div class="b5-pct">${Math.round(pct)}%</div>
                        </div>`;
                }).join('');

                html += `
                <div id="tab-big5" class="tab-content">
                    <div class="b5-section">
                        <div class="section-heading">
                            <span class="section-num">02</span>
                            <h2>${b5.label}</h2>
                        </div>
                        <div class="section-desc">${b5.description}</div>
                        <div class="b5-profile-summary">${b5.profile_summary}</div>
                        <div class="b5-trait-list">${traitsHtml}</div>
                    </div>
                </div>`;
            }

            // ── MULTIPLE INTELLIGENCE SECTION ──
            if (sub.multiple_intelligence) {
                const mi = sub.multiple_intelligence;
                const icons = { LI: '📚', LMI: '🔢', MI: '🎵', BKI: '🏃', SVI: '🎨', IPI: '🤝', INPI: '🧘', NI: '🌿', EI: '🌌' };
                const intelligenceOrder = ['LI', 'LMI', 'MI', 'BKI', 'SVI', 'IPI', 'INPI', 'NI', 'EI'];
                const dominantIcon = icons[mi.dominant_intelligences[0]] || '🧠';

                const miCards = intelligenceOrder.map(key => {
                    if (!mi.intelligences || !mi.intelligences[key]) return '';
                    const t = mi.intelligences[key];
                    const isDom = mi.dominant_intelligences.includes(key);
                    return `
                        <div class="mi-card" style="${isDom ? 'border-color:#6C63FF;background:#f5f4ff;' : ''}">
                            <div class="mi-card-top">
                                <span class="mi-card-label">${icons[key] || ''} ${t.label}</span>
                                <span class="mi-card-pct">${Math.round(t.score_pct)}%</span>
                            </div>
                            <div class="mi-bar-wrap"><div class="mi-bar-fill ${key}" data-mi-width="${t.score_pct}" style="width:0%"></div></div>
                            <div class="mi-card-desc">${t.description}</div>
                        </div>`;
                }).join('');

                html += `
                <div id="tab-mi" class="tab-content">
                    <div class="mi-section">
                        <div class="section-heading"><span class="section-num">03</span><h2>${mi.label}</h2></div>
                        <div class="section-desc">${mi.description}</div>
                        <div class="mi-dominant-banner">
                            <div class="mi-dominant-icon">${dominantIcon}</div>
                            <div class="mi-dominant-text">
                                <h3>Dominant Intelligence: ${mi.dominant_labels.join(' & ')}</h3>
                                <p>${mi.profile_summary}</p>
                            </div>
                        </div>
                        <div class="mi-grid">${miCards}</div>
                    </div>
                </div>`;
            }

            // ── ENNEAGRAM SECTION ──
            if (sub.enneagram) {
                const en = sub.enneagram;
                html += `
                <div id="tab-enneagram" class="tab-content">
                    <div class="section-block">
                        <div class="section-heading"><span class="section-num">04</span><h2>${en.label}</h2></div>
                        <div class="section-desc">${en.description}</div>
                        
                        <!-- Core Identity Box -->
                        <div style="background:#000; color:#fff; padding:3rem; margin-bottom:2rem; position:relative; overflow:hidden;">
                            <div style="position:absolute; top:-20px; right:-20px; font-size:15rem; font-weight:900; opacity:0.03; line-height:1; pointer-events:none;">${en.primary_type.number}</div>
                            
                            <div style="font-size:0.8rem; font-weight:800; text-transform:uppercase; letter-spacing:0.1em; color:#888; margin-bottom:0.5rem;">Primary Pattern</div>
                            <div style="font-size:3rem; font-weight:900; line-height:1.1; margin-bottom:0.5rem;">Type ${en.primary_type.number}: ${en.primary_type.label}</div>
                            
                            <div style="display:flex; align-items:center; gap:0.8rem; margin-top:2rem;">
                                <div style="background:var(--c-purple); color:#fff; padding:0.3rem 0.8rem; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em;">Wing ${en.primary_type.wing}</div>
                                <span style="font-size:0.9rem; opacity:0.8;">Influenced by ${en.primary_type.wing_label}</span>
                            </div>
                        </div>

                        <!-- Intelligence Center -->
                        <div style="border:1px solid #eee; padding:2rem; margin-bottom:2rem; background:#f9f9f9; display:flex; align-items:flex-start; gap:1.5rem;">
                            <div style="width:60px; height:60px; background:var(--c-teal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:900; border-radius:50%; flex-shrink:0;">
                                ${en.center.key === 'head' ? '🧠' : en.center.key === 'heart' ? '❤️' : '⚡'}
                            </div>
                            <div>
                                <div style="font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:0.1em; color:#666; margin-bottom:0.3rem;">Dominant Triad</div>
                                <h3 style="font-size:1.4rem; font-weight:800; margin:0 0 0.5rem 0;">${en.center.label}</h3>
                                <p style="margin:0; font-size:0.95rem; color:#444; line-height:1.5;">You process the world primarily through the ${en.center.key} center, meaning your core drive is <strong>${en.center.core_motivation}</strong>.</p>
                            </div>
                        </div>

                        <!-- Core Motivation & Interpretation -->
                        <div class="interp-box" style="border-left-color:var(--c-purple); margin-bottom:3rem; margin-top:0;">
                            <strong>Analytical Interpretation</strong>
                            <p>${en.interpretation}</p>
                        </div>
                        
                        <!-- 9 Types Breakdown -->
                        <h3 style="font-size:1.2rem; font-weight:800; margin-bottom:1.5rem; border-bottom:2px solid #eee; padding-bottom:0.8rem;">FULL ENNEAGRAM PROFILE (LIVE)</h3>
                        <div style="display:flex; flex-direction:column; gap:0.5rem; align-items:center;">
                            
                            <!-- Detail Grid (Now on top) -->
                            <div style="width:100%; display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:1rem; align-content:start;">
                                ${en.type_rankings.map(t => {
                    let isPrimary = t.type === en.primary_type.number;
                    let bg = isPrimary ? '#000' : '#fff';
                    let textC = isPrimary ? '#fff' : '#000';
                    let descColor = '#888';
                    if (t.descriptor === 'moderate') descColor = '#3498db';
                    if (t.descriptor === 'strong') descColor = '#1abc9c';
                    if (t.descriptor === 'dominant') descColor = '#e74c3c';

                    return '<div style="border:1px solid #eee; background:' + bg + '; padding:1rem; display:flex; align-items:center; gap:1rem;">' +
                        '<div style="font-size:1.6rem; font-weight:900; color:' + textC + '; width:20px;">' + t.type + '</div>' +
                        '<div style="flex:1;">' +
                        '<div style="font-size:0.8rem; font-weight:700; color:' + textC + '; line-height:1.2;">' + t.label + '</div>' +
                        '<div style="font-size:0.6rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:' + descColor + '; margin-top:0.3rem;">' + t.score_pct + '% &middot; ' + t.descriptor + '</div>' +
                        '</div></div>';
                }).join('')}
                            </div>

                            <!-- Polar Area Chart Container (Upright & Balanced) -->
                            <div style="width:100%; max-width:550px; margin:0 auto 2rem auto; display:flex; justify-content:center; align-items:center; background:#f9f9f9; padding:2rem; border:1px solid #eee;">
                                <div style="position:relative; width:100%; max-width:450px; height:450px;">
                                    <canvas id="enneagramChart" style="display:block; width:100%; height:450px;"></canvas>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>`;
            }

            // ── BRAIN DOMINANCE SECTION ──
            if (sub.brain_dominance) {
                const bd = sub.brain_dominance;
                html += `
                <div id="tab-brain" class="tab-content">
                    <div class="section-block">
                        <div class="section-heading"><span class="section-num">05</span><h2>${bd.label}</h2></div>
                        <div class="section-desc">${bd.description}</div>
                        <div class="section-body">
                            <div style="margin-top:2rem;">
                                <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem; font-weight:900; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.1em;">
                                    <span>Left Brain (Analytical)</span>
                                    <span>Right Brain (Creative)</span>
                                </div>
                                <div style="height:50px; background:#f0f0f0; display:flex; border-radius:4px; overflow:hidden; border:1px solid #eee;">
                                    <div style="width:${bd.left.score_pct}%; background:#34495e; display:flex; align-items:center; padding-left:1.5rem; color:#fff; font-weight:800; transition: width 1.5s ease-out;">
                                        ${Math.round(bd.left.score_pct)}%
                                    </div>
                                    <div style="width:${bd.right.score_pct}%; background:var(--c-teal); display:flex; align-items:center; justify-content:flex-end; padding-right:1.5rem; color:#fff; font-weight:800; transition: width 1.5s ease-out;">
                                        ${Math.round(bd.right.score_pct)}%
                                    </div>
                                </div>
                                <div style="margin-top:2.5rem; padding:2rem; background:#fcfcfc; border-left:4px solid var(--c-teal);">
                                    <div style="font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:0.1em; color:#888; margin-bottom:0.5rem;">Primary Cognitive Style</div>
                                    <h3 style="font-size:1.8rem; font-weight:900; color:#000; margin:0 0 1rem 0; letter-spacing:-0.02em;">${bd.dominance.label}</h3>
                                    <p style="margin:0; font-size:1.05rem; color:#444; line-height:1.6; max-width:100%; font-style:normal;">
                                        ${bd.dominance.description}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            html += `</div>`; // Close results-container

            // ── COMPOSITE INSIGHTS ──
            html += `
                <div class="insights-block" id="sec-insights">
                    <h2>Composite Insights</h2>
                    <div class="insights-summary">${insights.personality_summary || insights.executive_summary || ""}</div>
                    <div class="insights-columns">
                        <div class="insight-col strengths">
                            <h3>Top Strengths</h3>
                            <ul>${insights.top_strengths.map(s => `<li>${s}</li>`).join('')}</ul>
                        </div>
                        <div class="insight-col growth">
                            <h3>Growth Areas</h3>
                            <ul>${insights.growth_areas.map(g => `<li>${g}</li>`).join('')}</ul>
                        </div>
                    </div>
                    
                    <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;color:#888;margin-top:2.5rem;margin-bottom:1.2rem;">Recommended Career Domains</div>
                    <div class="career-paths-grid">
                        ${(insights.recommended_career_domains || []).map(c => {
                const name = typeof c === 'object' ? (c.name || 'Undefined') : c;
                const reason = typeof c === 'object' ? (c.reason || '') : '';
                return `
                            <div class="career-path-card">
                                <div class="career-path-name">${name}</div>
                                <div class="career-path-reason">${reason}</div>
                            </div>`;
            }).join('')}
                    </div>

                    <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;color:#888;margin-top:2rem;margin-bottom:0.8rem;">Workplace Compatibility</div>
                    <div class="compat-grid">
                        <div class="compat-card">
                            <div class="compat-label">Work Environment</div>
                            <div class="compat-value">${insights.compatibility_notes?.work_environment || 'Assessment pending'}</div>
                        </div>
                        <div class="compat-card">
                            <div class="compat-label">Team Role</div>
                            <div class="compat-value">${insights.compatibility_notes?.team_role || 'Assessment pending'}</div>
                        </div>
                        <div class="compat-card">
                            <div class="compat-label">Leadership Style</div>
                            <div class="compat-value">${insights.compatibility_notes?.leadership_style || 'Assessment pending'}</div>
                        </div>
                    </div>
                </div>`;

            // ── FOOTER ──
            html += `
                <div class="report-footer-bar">
                    <span>${meta.report_id}</span>
                    <span>Psychometric Assessment · ${meta.total_questions_answered} Points</span>
                    <button class="print-btn" onclick="window.print()">Save PDF</button>
                </div>`;

            root.innerHTML = html;

            // Animate Big 5 trait bars after DOM render
            setTimeout(() => {
                document.querySelectorAll('.b5-bar-fill').forEach(bar => {
                    const target = bar.getAttribute('data-width');
                    if (target) bar.style.width = target + '%';
                });
                document.querySelectorAll('.mi-bar-fill').forEach(bar => {
                    const target = bar.getAttribute('data-mi-width');
                    if (target) bar.style.width = target + '%';
                });

                // Define chart initialization logic for Enneagram
                if (sub.enneagram) {
                    window.initEnneagramChart = function () {
                        const ctx = document.getElementById('enneagramChart');
                        if (!ctx) return;

                        if (window.enneagramChartInstance) {
                            window.enneagramChartInstance.destroy();
                        }

                        const labels = [];
                        const data = [];

                        const bgColors = [
                            'rgb(247, 172, 83)',   // 1: Orange
                            'rgb(255, 111, 105)',  // 2: Coral/Red
                            'rgb(233, 88, 154)',   // 3: Pink
                            'rgb(167, 101, 166)',  // 4: Purple
                            'rgb(69, 162, 185)',   // 5: Blue
                            'rgb(0, 188, 212)',    // 6: Cyan/Aqua
                            'rgb(58, 181, 133)',   // 7: Green
                            'rgb(144, 225, 122)',  // 8: Lime Green
                            'rgb(252, 208, 89)'    // 9: Yellow
                        ];

                        for (let i = 1; i <= 9; i++) {
                            const tInfo = sub.enneagram.type_scores[`type_${i}`];
                            labels.push(`Type ${i}: ${tInfo.label}`);

                            let chartVal = tInfo.score_pct || 0;
                            data.push(chartVal);
                        }

                        try {
                            window.enneagramChartInstance = new Chart(ctx, {
                                type: 'polarArea',
                                data: {
                                    labels: labels,
                                    datasets: [{
                                        data: data,
                                        backgroundColor: bgColors,
                                        borderWidth: 0,
                                        hoverOffset: 4
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    layout: {
                                        padding: 20
                                    },
                                    scales: {
                                        r: {
                                            min: 0,
                                            max: 100,
                                            ticks: { display: false },
                                            grid: { color: 'rgba(0,0,0,0.5)', circular: true, lineWidth: 3 },
                                            angleLines: { color: 'rgba(0,0,0,0.5)', lineWidth: 3 }
                                        }
                                    },
                                    plugins: {
                                        legend: { display: false },
                                        tooltip: {
                                            callbacks: {
                                                label: function (context) {
                                                    return `${context.label}: ${context.raw}%`;
                                                }
                                            }
                                        }
                                    }
                                }
                            });
                        } catch (err) {
                            ctx.parentElement.innerHTML = `<div style="color:red;font-weight:bold;padding:1rem;">CHART ERROR:<br>${err.message}<br>${err.stack}</div>`;
                        }
                    };

                    // Always try to initialize immediately. With explicit canvas height, Chart.js can draw even if display:none.
                    setTimeout(() => window.initEnneagramChart(), 10);
                }
            }, 100);
        }

        loadReport();

        // Report Lookup Modal Logic
        function openReportModal(e) {
            e.preventDefault();
            document.getElementById('reportModal').classList.add('active');
            document.getElementById('lookupEmail').value = '';
            document.getElementById('lookupPassword').value = '';
            document.getElementById('lookupResults').innerHTML = '';
            setTimeout(() => document.getElementById('lookupEmail').focus(), 100);
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.remove('active');
        }

        /**
         * Fired after Google authentication for report lookup.
         * Fills the email field and prompts for password.
         */
        async function handleGoogleLookup(response) {
            try {
                const verifyRes = await fetch('/auth/google-verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                const userData = await verifyRes.json();
                
                if (userData.status === 'success') {
                    // Fill email and move to password field
                    document.getElementById('lookupEmail').value = userData.email;
                    document.getElementById('lookupPassword').focus();
                    
                    // Clear any previous results
                    document.getElementById('lookupResults').innerHTML = '<p style="color:#2ecc71; font-size:0.9rem;">Email verified via Google. Please enter your password to continue.</p>';
                }
            } catch (err) {
                console.error("Google Lookup Error:", err);
            }
        }

        /**
         * Standard password-based report lookup.
         */
        async function lookupReports() {
            const email = document.getElementById('lookupEmail').value.trim();
            const password = document.getElementById('lookupPassword').value.trim();
            const resDiv = document.getElementById('lookupResults');

            if (!email) {
                resDiv.innerHTML = '<p style="color:red; font-size:0.9rem;">Please enter an email.</p>';
                return;
            }
            if (!password) {
                resDiv.innerHTML = '<p style="color:red; font-size:0.9rem;">Please enter your password.</p>';
                return;
            }

            resDiv.innerHTML = '<p style="color:#666; font-size:0.9rem;">Searching...</p>';

            try {
                const res = await fetch('/api/reports/user/' + encodeURIComponent(email) + '?password=' + encodeURIComponent(password));

                if (res.status === 401) {
                    resDiv.innerHTML = '<p style="color:red; font-size:0.9rem;">Invalid password.</p>';
                    return;
                }

                const data = await res.json();

                if (!data || data.length === 0) {
                    resDiv.innerHTML = '<p style="color:#666; font-size:0.9rem; font-style:italic;">No reports found. Make sure you entered the correct email used during the assessment.</p>';
                    return;
                }

                let html = '';
                data.forEach(r => {
                    const d = new Date(r.created_at);
                    html += `
                        <a href="/report?report_id=${r.report_id}" class="report-item">
                            <div>
                                <div class="ri-id">${r.report_id}</div>
                                <div class="ri-date">${d.toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' })} &middot; ${r.candidate_name}</div>
                            </div>
                            <span style="font-weight:700;">&rarr;</span>
                        </a>
                    `;
                });
                resDiv.innerHTML = html;
            } catch (err) {
                resDiv.innerHTML = '<p style="color:red; font-size:0.9rem;">Error connecting to server. Please try again.</p>';
            }
        }
    </script>
    <!-- Report Lookup Modal -->
    <div id="reportModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeReportModal()" title="Close">&times;</button>
            <h2 style="font-size:1.8rem; margin-bottom:0.5rem; text-transform:uppercase; letter-spacing:-1px;">Your Reports</h2>
            <p style="font-size:0.9rem; color:#666; margin-bottom:1.5rem;">Enter your details or use Google to find your past assessment reports.</p>
            
            <!-- Google Sign-In for Lookup -->
            <div id="g_id_onload"
                data-client_id="363945290379-gogiov7n9mkc8pjqcmq0gapalrasesfg.apps.googleusercontent.com"
                data-context="signin"
                data-ux_mode="popup"
                data-callback="handleGoogleLookup"
                data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                data-type="standard"
                data-shape="rectangular"
                data-theme="outline"
                data-text="signin_with"
                data-size="large"
                data-logo_alignment="left"
                style="margin-bottom: 0.75rem; display: flex; justify-content: center;">
            </div>

            <div style="text-align: center; margin: 0.5rem 0 1rem; font-size: 0.7rem; font-weight: 700; color: #aaa; display: flex; align-items: center; gap: 1rem; text-transform: uppercase; letter-spacing: 0.05em;">
                <div style="flex: 1; height: 1px; background: #eee;"></div>
                <span>Or use email and password</span>
                <div style="flex: 1; height: 1px; background: #eee;"></div>
            </div>
            
            <div style="display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1rem;">
                <input type="email" id="lookupEmail" placeholder="candidate@example.com" style="padding:0.8rem; border:1px solid #ccc; font-size:1rem; outline:none;">
                <div style="display:flex; gap:0.5rem;">
                    <input type="password" id="lookupPassword" placeholder="Password" style="flex:1; padding:0.8rem; border:1px solid #ccc; font-size:1rem; outline:none;" onkeypress="if(event.key === 'Enter') lookupReports();">
                    <button onclick="lookupReports()" style="background:#000; color:#fff; border:none; padding:0.8rem 1.5rem; font-weight:700; cursor:pointer; text-transform:uppercase;">Search</button>
                </div>
            </div>
            
            <div id="lookupResults" style="max-height: 260px; overflow-y: auto; overflow-x: hidden; border-top: 1px solid #eee; padding-top: 1rem; padding-right: 5px; display: flex; flex-direction: column; gap: 0.5rem; scrollbar-width: thin; scrollbar-color: #ccc #f9f9f9;">
                <!-- Results rendered here -->
            </div>
        </div>
    </div>
</body>

</html>
