<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychometric Report | SCOE-Psychometrics</title>
    <meta name="description"
        content="Comprehensive psychometric assessment report with personality, intelligence, and behavioral analysis.">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ── Report Shell ── */
        .report-shell {
            max-width: 1100px;
            margin: 2rem auto 5rem auto;
            padding: 0 2rem;
        }

        /* ── Cover Header ── */
        .report-cover {
            border: 3px solid #000;
            padding: 3.5rem 3rem;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
        }

        .report-cover::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: #000;
            clip-path: polygon(100% 0, 0 0, 100% 100%);
            opacity: 0.04;
        }

        .cover-badge {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 0.4rem 1.2rem;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.2rem;
        }

        .cover-title {
            font-size: 2.8rem;
            line-height: 1.05;
            margin: 0 0 0.5rem 0;
            text-transform: uppercase;
        }

        .cover-subtitle {
            font-size: 1rem;
            color: #555;
            margin-bottom: 2rem;
        }

        .cover-meta {
            display: flex;
            gap: 3rem;
            flex-wrap: wrap;
            border-top: 2px solid #000;
            padding-top: 1.5rem;
            margin-top: 1.5rem;
        }

        .cover-meta-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .cover-meta-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #888;
            font-weight: 700;
        }

        .cover-meta-value {
            font-size: 1rem;
            font-weight: 700;
        }

        /* ── Snapshot Grid ── */
        .snapshot-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin-bottom: 3rem;
        }

        .snap-card {
            border: 2px solid #000;
            padding: 1.8rem 1.4rem;
            margin: -1px;
            text-align: center;
            transition: background 0.3s, color 0.3s;
        }

        .snap-card:hover {
            background: #000;
            color: #fff;
        }

        .snap-card:hover .snap-label,
        .snap-card:hover .snap-sub {
            color: #aaa;
        }

        .snap-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #888;
            font-weight: 700;
            margin-bottom: 0.6rem;
            transition: color 0.3s;
        }

        .snap-value {
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 0.3rem;
        }

        .snap-sub {
            font-size: 0.8rem;
            color: #555;
            transition: color 0.3s;
        }

        /* ── Section Blocks ── */
        .section-block {
            margin-bottom: 4rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s ease forwards;
        }

        .section-block:nth-child(1) {
            animation-delay: 0.1s;
        }

        .section-block:nth-child(2) {
            animation-delay: 0.2s;
        }

        .section-block:nth-child(3) {
            animation-delay: 0.3s;
        }

        .section-block:nth-child(4) {
            animation-delay: 0.4s;
        }

        .section-block:nth-child(5) {
            animation-delay: 0.5s;
        }

        .section-block:nth-child(6) {
            animation-delay: 0.6s;
        }

        .section-block:nth-child(7) {
            animation-delay: 0.7s;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-num {
            display: inline-block;
            background: #000;
            color: #fff;
            width: 36px;
            height: 36px;
            line-height: 36px;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .section-heading {
            display: flex;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .section-heading h2 {
            font-size: 1.6rem;
            margin: 0;
            text-transform: uppercase;
        }

        .section-desc {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 2rem;
            padding-left: 52px;
        }

        .section-body {
            border: 2px solid #000;
            padding: 2.5rem;
            background: #fff;
        }

        /* ── Interpretation Box ── */
        .interp-box {
            background: #f8f8f8;
            border-left: 5px solid #000;
            padding: 1.5rem 2rem;
            margin-top: 2rem;
            font-size: 0.95rem;
            line-height: 1.7;
            color: #333;
        }

        .interp-box strong {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #888;
            margin-bottom: 0.5rem;
        }

        /* ── Horizontal Bars ── */
        .hbar-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .hbar-item {
            width: 100%;
        }

        .hbar-info {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
        }

        .hbar-track {
            height: 10px;
            background: #eee;
            border: 1px solid #ccc;
            position: relative;
            overflow: hidden;
        }

        .hbar-fill {
            height: 100%;
            background: #000;
            transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .hbar-tag {
            font-size: 0.7rem;
            color: #888;
            margin-top: 0.3rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ── Level Badge ── */
        .level-badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid #000;
            margin-left: 0.5rem;
        }

        .level-badge.high {
            background: #000;
            color: #fff;
        }

        .level-badge.very-high {
            background: #000;
            color: #fff;
        }

        .level-badge.moderate {
            background: #f0f0f0;
            color: #000;
        }

        .level-badge.moderate-high {
            background: #ddd;
            color: #000;
        }

        .level-badge.low {
            background: #fff;
            color: #000;
        }

        /* ── MBTI Dichotomy Bars ── */
        .mbti-type-display {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .mbti-type-code {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            line-height: 1;
        }

        .mbti-type-name {
            font-size: 1rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.3rem;
        }

        .dichotomy-row {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .dich-label {
            width: 120px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            text-align: right;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        .dich-bar-wrap {
            flex: 1;
            display: flex;
            height: 28px;
            border: 1px solid #000;
            overflow: hidden;
        }

        .dich-bar-a {
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            transition: width 1s ease;
        }

        .dich-bar-b {
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            transition: width 1s ease;
        }

        .dich-label-right {
            width: 120px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        /* ── Cognitive Stack ── */
        .cog-stack {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }

        .cog-card {
            border: 1px solid #000;
            padding: 1.2rem;
            text-align: center;
        }

        .cog-role {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .cog-code {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .cog-name {
            font-size: 0.7rem;
            color: #555;
            margin-top: 0.3rem;
        }

        .cog-strength {
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 0.5rem;
        }

        /* ── Temperament ── */
        .temp-blend {
            text-align: center;
            margin-bottom: 2rem;
        }

        .temp-blend-label {
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .temp-chart-row {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            align-items: start;
        }

        .temp-traits-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .temp-trait-card {
            border: 1px solid #ddd;
            padding: 1rem;
        }

        .temp-trait-name {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .temp-trait-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .temp-tag {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border: 1px solid #000;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ── Brain Hemispheres ── */
        .brain-display {
            display: grid;
            grid-template-columns: 1fr 80px 1fr;
            gap: 0;
            align-items: stretch;
            margin-bottom: 2rem;
        }

        .brain-side {
            padding: 2rem;
            border: 2px solid #000;
        }

        .brain-side.left {
            border-right: none;
        }

        .brain-side.right {
            border-left: none;
        }

        .brain-center {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #000;
            background: #000;
            color: #fff;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-weight: 700;
        }

        .brain-pct {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
        }

        .brain-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .brain-traits {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .brain-trait-tag {
            font-size: 0.6rem;
            padding: 0.15rem 0.5rem;
            border: 1px solid currentColor;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ── Enneagram ── */
        .ennea-hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .ennea-type-num {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
        }

        .ennea-type-name {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #555;
        }

        .ennea-wing {
            font-size: 0.8rem;
            margin-top: 0.5rem;
            color: #888;
        }

        .ennea-meta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .ennea-meta-card {
            border: 1px solid #000;
            padding: 1rem;
            text-align: center;
        }

        .ennea-meta-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #888;
            margin-bottom: 0.4rem;
            font-weight: 700;
        }

        .ennea-meta-value {
            font-size: 1rem;
            font-weight: 700;
        }

        .ennea-directions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        .dir-card {
            padding: 1.5rem;
            border: 2px solid #000;
        }

        .dir-card.growth {
            background: #f0f8f0;
        }

        .dir-card.stress {
            background: #f8f0f0;
        }

        .dir-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .dir-card.growth .dir-label {
            color: #2a7a2a;
        }

        .dir-card.stress .dir-label {
            color: #7a2a2a;
        }

        .dir-type {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .dir-desc {
            font-size: 0.85rem;
            color: #555;
            line-height: 1.5;
        }

        /* ── Composite Insights ── */
        .insights-block {
            border: 3px solid #000;
            padding: 3rem;
            margin-bottom: 3rem;
            background: #fafafa;
        }

        .insights-block h2 {
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            border-bottom: 3px solid #000;
            padding-bottom: 1rem;
        }

        .insights-summary {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #333;
            margin-bottom: 2.5rem;
        }

        .insights-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2.5rem;
        }

        .insight-col h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #000;
        }

        .insight-col ul {
            list-style: none;
            padding: 0;
        }

        .insight-col li {
            padding: 0.6rem 0 0.6rem 1.2rem;
            position: relative;
            font-size: 0.9rem;
            border-bottom: 1px solid #eee;
        }

        .insight-col li::before {
            content: '■';
            position: absolute;
            left: 0;
            font-size: 0.6rem;
            top: 0.75rem;
        }

        .insight-col.strengths li::before {
            color: #000;
        }

        .insight-col.growth li::before {
            color: #888;
        }

        .career-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .career-tag {
            padding: 0.5rem 1rem;
            border: 2px solid #000;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s;
        }

        .career-tag:hover {
            background: #000;
            color: #fff;
        }

        .compat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .compat-card {
            border: 1px solid #000;
            padding: 1.2rem;
        }

        .compat-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #888;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .compat-value {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #333;
        }

        /* ── Report Footer ── */
        .report-footer-bar {
            border-top: 3px solid #000;
            padding-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .report-footer-bar span {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .print-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            border: 2px solid #000;
            background: #000;
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .print-btn:hover {
            background: #fff;
            color: #000;
        }

        /* ── Chart containers ── */
        .chart-wrap {
            max-width: 500px;
            margin: 0 auto;
        }

        .chart-wrap-wide {
            max-width: 100%;
        }

        /* ── Print Styles ── */
        @media print {

            header,
            footer,
            .print-btn {
                display: none !important;
            }

            .report-shell {
                margin: 0;
                padding: 0;
            }

            .section-block {
                break-inside: avoid;
                animation: none;
                opacity: 1;
                transform: none;
            }

            .section-body {
                border: 1px solid #000;
            }
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .snapshot-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .cover-title {
                font-size: 1.8rem;
            }

            .mbti-type-code {
                font-size: 2.5rem;
            }

            .cog-stack {
                grid-template-columns: repeat(2, 1fr);
            }

            .temp-chart-row {
                grid-template-columns: 1fr;
            }

            .brain-display {
                grid-template-columns: 1fr;
            }

            .brain-center {
                writing-mode: horizontal-tb;
                padding: 0.5rem;
            }

            .brain-side.left,
            .brain-side.right {
                border: 2px solid #000;
            }

            .ennea-meta-grid {
                grid-template-columns: 1fr;
            }

            .ennea-directions {
                grid-template-columns: 1fr;
            }

            .insights-columns {
                grid-template-columns: 1fr;
            }

            .compat-grid {
                grid-template-columns: 1fr;
            }

            .dichotomy-row {
                flex-wrap: wrap;
            }

            .dich-label,
            .dich-label-right {
                width: 100%;
                text-align: left;
            }

            .section-body {
                padding: 1.5rem;
            }

            .report-cover {
                padding: 2rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-container">
            <img src="/static/img/SCOE_logo.png" alt="Logo" class="nav-logo">
            <span class="logo">ScoePsychometrics</span>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/exam">Exam</a></li>
            </ul>
        </nav>
    </header>

    <div style="height:90px;"></div>

    <main class="report-shell" id="report-root">
        <p style="text-align:center;padding:4rem;color:#888;font-size:1.1rem;">Loading report data…</p>
    </main>

    <footer>
        <div class="logo-container">
            <img src="/static/img/SCOE_logo.png" alt="Logo" class="nav-logo" style="filter:invert(1);">
            <span class="logo" style="color:#fff;">ScoePsychometrics</span>
        </div>
        <div class="footer-links">
            <span>© 2026 InnovateX</span>
        </div>
    </footer>

    <script>
        // ───────────────────────────────────────────
        //  REPORT RENDERER — reads JSON, builds HTML
        // ───────────────────────────────────────────

        Chart.defaults.font.family = "'Roboto Mono', monospace";
        Chart.defaults.color = '#000';

        async function loadReport() {
            // In production, this would be fetched from an API endpoint.
            // For now, load the static JSON file.
            const res = await fetch('/static/data/sample_report_data.json');
            const data = await res.json();
            renderReport(data);
        }

        function levelClass(level) {
            return (level || 'moderate').replace(/\s+/g, '-').toLowerCase();
        }

        function formatDuration(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}m ${s}s`;
        }

        function renderReport(D) {
            const root = document.getElementById('report-root');
            const meta = D.meta;
            const sub = D.subtests;
            const insights = D.composite_insights;

            let html = '';

            // ── COVER ──
            html += `
      <div class="report-cover">
        <div class="cover-badge">Psychometric Assessment Report</div>
        <h1 class="cover-title">${meta.candidate.name.toUpperCase()}</h1>
        <div class="cover-subtitle">Comprehensive Multi-Dimensional Personality & Intelligence Profile</div>
        <div class="cover-meta">
          <div class="cover-meta-item">
            <span class="cover-meta-label">Report ID</span>
            <span class="cover-meta-value">${meta.report_id}</span>
          </div>
          <div class="cover-meta-item">
            <span class="cover-meta-label">Generated</span>
            <span class="cover-meta-value">${new Date(meta.generated_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
          </div>
          <div class="cover-meta-item">
            <span class="cover-meta-label">Duration</span>
            <span class="cover-meta-value">${formatDuration(meta.quiz_duration_seconds)}</span>
          </div>
          <div class="cover-meta-item">
            <span class="cover-meta-label">Questions</span>
            <span class="cover-meta-value">${meta.total_questions_answered}</span>
