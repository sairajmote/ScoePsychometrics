<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychometric Report | ScoePsychometrics</title>
    <meta name="description"
        content="Comprehensive psychometric assessment report with personality, intelligence, and behavioral analysis.">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/css/report.css">
</head>

<body>

    <header>
        <div class="logo-container">
            <img src="/static/img/SCOE_logo.png" alt="ScoePsychometrics Logo" class="nav-logo">
            <span class="logo">ScoePsychometrics</span>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/exam">Exam</a></li>
                <li><a href="#" onclick="openReportModal(event)">View Your Report</a></li>
            </ul>
        </nav>
    </header>

    <div class="section-nav" id="section-nav">
        <a href="#sec-overview" class="nav-active">Overview</a>
        <a href="#sec-results">Results</a>
        <a href="#sec-big5">Big Five</a>
        <a href="#sec-mi">Multiple Intelligence</a>
        <a href="#sec-insights">Insights</a>
    </div>

    <main class="report-shell">
        <div id="report-root">
            <div style="text-align:center;padding:5rem;">
                <p>Loading report data...</p>
            </div>
        </div>
    </main>

    <script src="/static/js/report.js"></script>
    <!-- Report Lookup Modal -->
    <div id="reportModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeReportModal()" title="Close">&times;</button>
            <h2 style="font-size:1.8rem; margin-bottom:0.5rem; text-transform:uppercase; letter-spacing:-1px;">Your
                Reports</h2>
            <p style="font-size:0.9rem; color:#666; margin-bottom:1.5rem;">Enter your details or use Google to find your
                past assessment reports.</p>

            <!-- Google Sign-In for Lookup -->
            <div id="g_id_onload"
                data-client_id="363945290379-gogiov7n9mkc8pjqcmq0gapalrasesfg.apps.googleusercontent.com"
                data-context="signin" data-ux_mode="popup" data-callback="handleGoogleLookup" data-auto_prompt="false">
            </div>

            <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
                data-text="signin_with" data-size="large" data-logo_alignment="left"
                style="margin-bottom: 0.75rem; display: flex; justify-content: center;">
            </div>

            <div
                style="text-align: center; margin: 0.5rem 0 1rem; font-size: 0.7rem; font-weight: 700; color: #aaa; display: flex; align-items: center; gap: 1rem; text-transform: uppercase; letter-spacing: 0.05em;">
                <div style="flex: 1; height: 1px; background: #eee;"></div>
                <span>Or use email and password</span>
                <div style="flex: 1; height: 1px; background: #eee;"></div>
            </div>

            <div style="display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1rem;">
                <input type="email" id="lookupEmail" placeholder="candidate@example.com"
                    style="padding:0.8rem; border:1px solid #ccc; font-size:1rem; outline:none;">
                <div style="display:flex; gap:0.5rem;">
                    <input type="password" id="lookupPassword" placeholder="Password"
                        style="flex:1; padding:0.8rem; border:1px solid #ccc; font-size:1rem; outline:none;"
                        onkeypress="if(event.key === 'Enter') lookupReports();">
                    <button onclick="lookupReports()"
                        style="background:#000; color:#fff; border:none; padding:0.8rem 1.5rem; font-weight:700; cursor:pointer; text-transform:uppercase;">Search</button>
                </div>
            </div>

            <div id="lookupResults"
                style="max-height: 260px; overflow-y: auto; overflow-x: hidden; border-top: 1px solid #eee; padding-top: 1rem; padding-right: 5px; display: flex; flex-direction: column; gap: 0.5rem; scrollbar-width: thin; scrollbar-color: #ccc #f9f9f9;">
                <!-- Results rendered here -->
            </div>
        </div>
    </div>
    <div id="printable-report" class="printable-report"></div>
</body>

</html>
