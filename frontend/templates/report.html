<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychometric Report | ScoePsychometrics</title>
    <meta name="description"
        content="Comprehensive psychometric assessment report with personality, intelligence, and behavioral analysis.">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ── Color Palette ── */
        :root {
            --c-green: #2ecc71;
            --c-red: #e74c3c;
            --c-blue: #3498db;
            --c-yellow: #f1c40f;
            --c-purple: #9b59b6;
            --c-orange: #e67e22;
            --c-teal: #1abc9c;
            --c-green-light: rgba(46, 204, 113, 0.12);
            --c-blue-light: rgba(52, 152, 219, 0.12);
            --c-red-light: rgba(231, 76, 60, 0.12);
            --c-yellow-light: rgba(241, 196, 15, 0.12);
        }

        /* ── Section Nav Tabs ── */
        .section-nav {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .section-nav::-webkit-scrollbar {
            display: none;
        }

        .section-nav a {
            display: inline-block;
            padding: 0.7rem 1.2rem;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-decoration: none;
            color: #666;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .section-nav a:hover {
            color: #000;
            background: #f0f0f0;
        }

        .section-nav a.nav-active {
            color: #fff;
            background: var(--c-teal);
        }

        /* ── Report Shell ── */
        .report-shell {
            max-width: 1100px;
            margin: 0 auto 5rem auto;
            padding: 0 2rem;
        }

        /* ── Cover Header ── */
        .report-cover {
            border: 3px solid #000;
            padding: 3.5rem 3rem;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
            background: #fff;
        }

        .report-cover::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: #000;
            clip-path: polygon(100% 0, 0 0, 100% 100%);
            opacity: 0.04;
        }

        .cover-badge {
            display: inline-block;
            background: var(--c-teal);
            color: #fff;
            padding: 0.4rem 1.2rem;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
        }

        .cover-title {
            font-size: 3.5rem;
            line-height: 1;
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .cover-subtitle {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 3rem;
            max-width: 600px;
            line-height: 1.5;
        }

        .cover-meta {
            display: flex;
            gap: 2.5rem;
            flex-wrap: wrap;
            border-top: 1px solid #eee;
            padding-top: 2rem;
        }

        .cover-meta-item {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .cover-meta-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            color: #999;
        }

        .cover-meta-value {
            font-size: 1rem;
            font-weight: 700;
            color: #000;
        }

        /* ── Snapshot Grid ── */
        .snapshot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .snap-card {
            background: #f9f9f9;
            padding: 1.5rem;
            border: 1px solid #eee;
            transition: transform 0.3s;
        }

        .snap-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 800;
            color: #888;
            margin-bottom: 0.8rem;
        }

        .snap-value {
            font-size: 2.2rem;
            font-weight: 900;
            color: #000;
            line-height: 1;
            margin-bottom: 0.4rem;
        }

        .snap-sub {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--c-teal);
        }

        /* ── Section Blocks ── */
        .section-block {
            margin-bottom: 4rem;
            background: #fff;
            border: 1px solid #eee;
            padding: 3rem;
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .section-num {
            font-size: 1rem;
            font-weight: 900;
            background: #000;
            color: #fff;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-heading h2 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.01em;
        }

        .section-desc {
            font-size: 1.05rem;
            color: #666;
            margin-bottom: 2.5rem;
            max-width: 800px;
            line-height: 1.6;
        }

        /* ── MBTI Specific ── */
        .mbti-type-display {
            text-align: center;
            margin-bottom: 3rem;
            padding: 3rem;
            background: #f0fcf9;
            border: 1px solid #d1f2eb;
        }

        .mbti-type-code {
            font-size: 5rem;
            font-weight: 950;
            letter-spacing: -0.05em;
            color: #000;
            line-height: 1;
        }

        .mbti-type-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--c-teal);
            margin-top: 0.5rem;
        }

        .dichotomy-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.2rem;
        }

        .dich-label {
            width: 150px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .dich-label-right {
            width: 150px;
            text-align: right;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .dich-bar-wrap {
            flex: 1;
            height: 28px;
            background: #eee;
            display: flex;
            position: relative;
        }

        .dich-bar-a {
            background: var(--c-teal);
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 10px;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 800;
            transition: width 1s;
        }

        .dich-bar-b {
            background: #eee;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: #888;
            font-size: 0.7rem;
            font-weight: 800;
            flex: 1;
        }

        .interp-box {
            background: #f8f9fa;
            border-left: 4px solid var(--c-teal);
            padding: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #444;
            margin-top: 2rem;
        }

        .interp-box strong {
            display: block;
            margin-bottom: 0.5rem;
            color: #000;
            font-size: 1rem;
        }

        /* ── Insights Block ── */
        .insights-block {
            background: #000;
            color: #fff;
            padding: 4rem 3rem;
            margin-bottom: 5rem;
        }

        .insights-block h2 {
            font-size: 2.5rem;
            font-weight: 850;
            margin-bottom: 1.5rem;
        }

        .insights-summary {
            font-size: 1.2rem;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 3rem;
            max-width: 900px;
        }

        .insights-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        .insight-col h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .insight-col ul {
            list-style: none;
            padding: 0;
        }

        .insight-col li {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .insight-col li::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--c-teal);
        }

        .career-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 2rem;
        }

        .career-tag {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* ── Footer ── */
        .report-footer-bar {
            background: #000;
            color: #fff;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .print-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 0.6rem 1.2rem;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        @media print {

            .section-nav,
            .report-footer-bar,
            .print-btn {
                display: none !important;
            }

            .report-shell {
                margin: 0;
                padding: 0;
                max-width: 100%;
            }

            body {
                background: white;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-container">
            <img src="/static/img/SCOE_logo.png" alt="ScoePsychometrics Logo" class="nav-logo">
            <span class="logo">ScoePsychometrics</span>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/exam">Exam</a></li>
            </ul>
        </nav>
    </header>

    <div class="section-nav" id="section-nav">
        <a href="#sec-overview" class="nav-active">Overview</a>
        <a href="#sec-results">Results</a>
        <a href="#sec-insights">Insights</a>
    </div>

    <main class="report-shell" id="report-root">
        <div style="text-align:center;padding:5rem;">
            <p>Loading report data...</p>
        </div>
    </main>

    <script>
        async function loadReport() {
            const urlParams = new URLSearchParams(window.location.search);
            const reportId = urlParams.get('id');

            // Grab temperament result if passed from the exam submission
            window._temperamentType = urlParams.get('temperament') || '';
            window._temperamentDesc = urlParams.get('temperament_desc') || '';

            if (!reportId) {
                const res = await fetch('/static/data/sample_report_data.json');
                const data = await res.json();
                renderReport(data);
                return;
            }

            try {
                const res = await fetch(`/api/report/${reportId}`);
                if (!res.ok) throw new Error("Report not found");
                const data = await res.json();
                renderReport(data);
            } catch (err) {
                document.getElementById('report-root').innerHTML = `
                    <div style="text-align:center;padding:4rem;">
                        <h2 style="color:#e74c3c;">Report Not Found</h2>
                        <a href="/">Return to Home</a>
                    </div>
                `;
            }
        }

        function formatDuration(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}m ${s}s`;
        }

        function renderReport(D) {
            const root = document.getElementById('report-root');
            const meta = D.meta;
            const sub = D.subtests;
            const insights = D.composite_insights;

            let html = '';

            // ── COVER ──
            html += `
                <div class="report-cover" id="sec-overview">
                    <div class="cover-badge">Psychometric Assessment Report</div>
                    <h1 class="cover-title">${meta.candidate.name.toUpperCase()}</h1>
                    <div class="cover-subtitle">Targeted Personality Analysis: Myers-Briggs Type Indicator (MBTI) Profile</div>
                    <div class="cover-meta">
                        <div class="cover-meta-item">
                            <span class="cover-meta-label">Report ID</span>
                            <span class="cover-meta-value">${meta.report_id}</span>
                        </div>
                        <div class="cover-meta-item">
                            <span class="cover-meta-label">Generated</span>
                            <span class="cover-meta-value">${new Date(meta.generated_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
                        </div>
                        <div class="cover-meta-item">
                            <span class="cover-meta-label">Education</span>
                            <span class="cover-meta-value">${meta.candidate.education}</span>
                        </div>
                    </div>
                </div>`;

            // ── MBTI + TEMPERAMENT SNAPSHOT ──
            if (sub.mbti) {
                const tempType = window._temperamentType;
                const tempDesc = window._temperamentDesc;

                const temperamentCard = tempType ? `
                    <div class="snap-card" style="background:#000;color:#fff;border:none;">
                        <div class="snap-label" style="color:#888;">Temperament</div>
                        <div class="snap-value" style="color:#fff;font-size:1.8rem;">${tempType.toUpperCase()}</div>
                        <div class="snap-sub" style="color:#aaa;font-weight:500;font-size:0.8rem;font-style:italic;margin-top:0.4rem;">${tempDesc}</div>
                    </div>` : '';

                html += `
                <div class="snapshot-grid" id="sec-results">
                    <div class="snap-card">
                        <div class="snap-label">MBTI Type</div>
                        <div class="snap-value">${sub.mbti.result_type}</div>
                        <div class="snap-sub">${sub.mbti.type_label}</div>
                    </div>
                    ${temperamentCard}
                </div>`;

                const mbti = sub.mbti;
                const dichRows = Object.values(mbti.dichotomies).map(d => `
                    <div class="dichotomy-row">
                        <div class="dich-label">${d.dimension_a.label} (${d.dimension_a.code})</div>
                        <div class="dich-bar-wrap">
                            <div class="dich-bar-a" style="width:${d.dimension_a.score}%">${Math.round(d.dimension_a.score)}%</div>
                            <div class="dich-bar-b" style="width:${d.dimension_b.score}%">${Math.round(d.dimension_b.score)}%</div>
                        </div>
                        <div class="dich-label-right">${d.dimension_b.label} (${d.dimension_b.code})</div>
                    </div>
                `).join('');

                html += `
                <div class="section-block">
                    <div class="section-heading">
                        <span class="section-num">01</span>
                        <h2>${mbti.label}</h2>
                    </div>
                    <div class="section-desc">${mbti.description}</div>
                    <div class="section-body">
                        <div class="mbti-type-display">
                            <div class="mbti-type-code">${mbti.result_type}</div>
                            <div class="mbti-type-name">${mbti.type_label}</div>
                        </div>
                        ${dichRows}
                        <div class="interp-box">
                            <strong>Interpretation</strong>
                            ${mbti.interpretation}
                        </div>
                    </div>
                </div>`;
            }

            // ── COMPOSITE INSIGHTS ──
            html += `
                <div class="insights-block" id="sec-insights">
                    <h2>Composite Insights</h2>
                    <div class="insights-summary">${insights.personality_summary || insights.executive_summary || ""}</div>
                    <div class="insights-columns">
                        <div class="insight-col strengths">
                            <h3>Top Strengths</h3>
                            <ul>${insights.top_strengths.map(s => `<li>${s}</li>`).join('')}</ul>
                        </div>
                        <div class="insight-col growth">
                            <h3>Growth Areas</h3>
                            <ul>${insights.growth_areas.map(g => `<li>${g}</li>`).join('')}</ul>
                        </div>
                    </div>
                    <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;color:#888;margin-top:2rem;margin-bottom:1rem;">Recommended Careers</div>
                    <div class="career-tags">
                        ${(insights.recommended_career_domains || insights.career_domains || []).map(c => `<span class="career-tag">${c}</span>`).join('')}
                    </div>
                </div>`;

            // ── FOOTER ──
            html += `
                <div class="report-footer-bar">
                    <span>${meta.report_id}</span>
                    <span>Psychometric Assessment · ${meta.total_questions_answered} Points</span>
                    <button class="print-btn" onclick="window.print()">Save PDF</button>
                </div>`;

            root.innerHTML = html;
        }

        loadReport();
    </script>
</body>

</html>
