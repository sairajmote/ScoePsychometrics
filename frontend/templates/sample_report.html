<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Report | ScoePsychometrics</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --c-green: #2ecc71; --c-red: #e74c3c; --c-blue: #3498db;
            --c-yellow: #f1c40f; --c-purple: #9b59b6; --c-orange: #e67e22;
            --c-teal: #1abc9c; --c-pink: #e91e63;
        }

        .section-nav {
            max-width: 1100px; margin: 0 auto; padding: 0 2rem 1.5rem;
            overflow-x: auto; white-space: nowrap; scrollbar-width: none;
        }
        .section-nav::-webkit-scrollbar { display: none; }
        .section-nav a {
            display: inline-block; padding: 0.6rem 1.1rem;
            font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.06em; text-decoration: none; color: #666;
            transition: all 0.3s; border-radius: 4px; margin-right: 0.3rem;
        }
        .section-nav a:hover { color: #000; background: #f0f0f0; }
        .section-nav a.active { color: #fff; background: #000; }

        .report-shell { max-width: 1100px; margin: 0 auto 5rem; padding: 0 2rem; }

        /* Cover */
        .report-cover {
            border: 3px solid #000; padding: 3.5rem 3rem; margin-bottom: 3rem;
            position: relative; overflow: hidden; background: #fff;
        }
        .report-cover::before {
            content: ''; position: absolute; top: 0; right: 0;
            width: 180px; height: 180px; background: var(--c-teal);
            clip-path: polygon(100% 0, 0 0, 100% 100%); opacity: 0.08;
        }
        .cover-badge {
            display: inline-block; background: var(--c-teal); color: #fff;
            padding: 0.35rem 1.2rem; font-size: 0.7rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1.5rem;
        }
        .cover-title { font-size: 3.5rem; font-weight: 900; margin-bottom: 0.8rem; letter-spacing: -0.02em; }
        .cover-subtitle { font-size: 1.05rem; color: #555; margin-bottom: 2.5rem; line-height: 1.5; }
        .cover-meta { display: flex; gap: 2.5rem; flex-wrap: wrap; border-top: 1px solid #eee; padding-top: 2rem; }
        .cover-meta-item { display: flex; flex-direction: column; gap: 0.3rem; }
        .cover-meta-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: #999; }
        .cover-meta-value { font-size: 1rem; font-weight: 700; }

        /* Snapshot */
        .snapshot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 3rem; }
        .snap-card { background: #f9f9f9; padding: 1.5rem; border: 1px solid #eee; }
        .snap-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; color: #888; margin-bottom: 0.8rem; }
        .snap-value { font-size: 2.2rem; font-weight: 900; line-height: 1; margin-bottom: 0.4rem; }
        .snap-sub { font-size: 0.8rem; font-weight: 700; color: var(--c-teal); }

        /* Section blocks */
        .section-block { margin-bottom: 4rem; background: #fff; border: 1px solid #eee; padding: 3rem; }
        .section-heading { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; }
        .section-num { font-size: 1rem; font-weight: 900; background: #000; color: #fff; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .section-heading h2 { font-size: 2rem; font-weight: 800; margin: 0; }
        .section-desc { font-size: 1rem; color: #666; margin-bottom: 2.5rem; line-height: 1.6; max-width: 800px; }

        /* H-bars */
        .hbar-list { list-style: none; padding: 0; margin: 0; }
        .hbar-item { margin-bottom: 1.2rem; }
        .hbar-info { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.5rem; }
        .hbar-track { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
        .hbar-fill { height: 100%; background: var(--c-teal); border-radius: 4px; transition: width 1.2s ease; width: 0%; }
        .hbar-tag { font-size: 0.7rem; color: #888; display: block; margin-top: 0.3rem; }

        /* Level badges */
        .level-badge { display: inline-block; font-size: 0.6rem; padding: 2px 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 2px; margin-left: 6px; }
        .level-badge.high, .level-badge.very-high { background: #d5f5e3; color: #1e8449; }
        .level-badge.moderate, .level-badge.moderate-high { background: #fef9e7; color: #d4ac0d; }
        .level-badge.low { background: #fadbd8; color: #922b21; }

        /* MBTI */
        .mbti-type-display { text-align: center; padding: 3rem; background: #f0fcf9; border: 1px solid #d1f2eb; margin-bottom: 2.5rem; }
        .mbti-type-code { font-size: 5rem; font-weight: 900; letter-spacing: -0.05em; line-height: 1; }
        .mbti-type-name { font-size: 1.4rem; font-weight: 700; color: var(--c-teal); margin-top: 0.5rem; }
        .dichotomy-row { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.2rem; }
        .dich-label { width: 170px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .dich-label-right { width: 170px; text-align: right; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .dich-bar-wrap { flex: 1; height: 26px; background: #eee; display: flex; }
        .dich-bar-a { background: var(--c-teal); height: 100%; display: flex; align-items: center; padding-left: 8px; color: #fff; font-size: 0.68rem; font-weight: 800; }
        .dich-bar-b { height: 100%; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; color: #aaa; font-size: 0.68rem; font-weight: 800; flex: 1; }

        /* Cognitive functions */
        .cog-stack { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 1rem; }
        .cog-card { border: 1px solid #eee; padding: 1.2rem; text-align: center; }
        .cog-role { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; color: #888; margin-bottom: 0.5rem; }
        .cog-code { font-size: 2rem; font-weight: 900; }
        .cog-name { font-size: 0.75rem; color: #555; margin: 0.3rem 0; }
        .cog-strength { font-size: 0.8rem; font-weight: 700; color: var(--c-teal); }

        /* Temperament */
        .temp-blend { text-align: center; margin-bottom: 2rem; }
        .temp-blend-label { font-size: 2rem; font-weight: 900; }
        .temp-traits-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .temp-trait-card { border: 1px solid #eee; padding: 1rem; }
        .temp-trait-name { font-size: 0.8rem; font-weight: 700; margin-bottom: 0.6rem; }
        .temp-tag { display: inline-block; background: #f0f0f0; font-size: 0.65rem; padding: 3px 8px; margin: 2px; font-weight: 600; border-radius: 2px; }

        /* Learning styles */
        .ls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .ls-card { border: 1px solid #ddd; padding: 1.2rem; }
        .ls-card.primary { background: #000; color: #fff; }
        .ls-pct { font-size: 2rem; font-weight: 900; margin: 0.3rem 0; }
        .ls-label { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.08em; opacity: 0.6; }
        .ls-tips { margin-top: 0.8rem; font-size: 0.75rem; opacity: 0.75; }
        .ls-tips div { margin-bottom: 0.3rem; }

        /* Brain */
        .brain-display { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1.5rem; align-items: center; margin-bottom: 2rem; }
        .brain-center { font-weight: 900; font-size: 1.2rem; text-align: center; writing-mode: vertical-rl; letter-spacing: 0.15em; opacity: 0.15; }
        .brain-pct { font-size: 3rem; font-weight: 900; margin: 0.5rem 0; }
        .brain-trait-tag { display: inline-block; background: #f0f0f0; font-size: 0.65rem; padding: 3px 8px; margin: 2px; font-weight: 600; }

        /* Enneagram */
        .ennea-hero { text-align: center; padding: 3rem; background: var(--c-purple); color: #fff; margin-bottom: 2rem; }
        .ennea-type-num { font-size: 5rem; font-weight: 900; line-height: 1; }
        .ennea-type-name { font-size: 1.4rem; font-weight: 700; opacity: 0.9; }
        .ennea-wing { font-size: 0.8rem; opacity: 0.75; margin-top: 0.5rem; }
        .ennea-meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .ennea-meta-card { border: 1px solid #eee; padding: 1rem; text-align: center; }
        .ennea-meta-label { font-size: 0.65rem; text-transform: uppercase; font-weight: 700; color: #888; margin-bottom: 0.5rem; }
        .ennea-meta-value { font-size: 1rem; font-weight: 700; }
        .ennea-directions { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
        .dir-card { padding: 1.5rem; }
        .dir-card.growth { background: #eafaf1; border-left: 4px solid var(--c-green); }
        .dir-card.stress { background: #fdf2f8; border-left: 4px solid var(--c-red); }
        .dir-label { font-size: 0.65rem; text-transform: uppercase; font-weight: 700; color: #888; margin-bottom: 0.5rem; }
        .dir-type { font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem; }
        .dir-desc { font-size: 0.82rem; color: #555; }

        /* Interpretation box */
        .interp-box { background: #f8f9fa; border-left: 4px solid var(--c-teal); padding: 1.5rem; font-size: 0.95rem; line-height: 1.6; color: #444; margin-top: 2rem; }
        .interp-box strong { display: block; margin-bottom: 0.5rem; color: #000; }

        /* Insights */
        .insights-block { background: #000; color: #fff; padding: 4rem 3rem; margin-bottom: 5rem; }
        .insights-block h2 { font-size: 2.5rem; font-weight: 900; margin-bottom: 1.5rem; }
        .insights-summary { font-size: 1.15rem; line-height: 1.7; opacity: 0.9; margin-bottom: 3rem; max-width: 900px; }
        .insights-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; margin-bottom: 2.5rem; }
        .insight-col h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .insight-col ul { list-style: none; padding: 0; }
        .insight-col li { font-size: 1rem; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 1rem; }
        .insight-col li::before { content: ''; width: 8px; height: 8px; background: var(--c-teal); flex-shrink: 0; }
        .career-tags { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1rem; }
        .career-tag { padding: 0.5rem 1rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); font-size: 0.8rem; font-weight: 600; }
        .compat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1rem; }
        .compat-card { border: 1px solid rgba(255,255,255,0.15); padding: 1.2rem; }
        .compat-label { font-size: 0.62rem; text-transform: uppercase; font-weight: 700; color: #aaa; margin-bottom: 0.5rem; }
        .compat-value { font-size: 0.85rem; line-height: 1.4; }

        /* Footer */
        .report-footer-bar { background: #000; color: #fff; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
        .print-btn { background: #fff; color: #000; border: none; padding: 0.6rem 1.2rem; font-size: 0.7rem; font-weight: 700; cursor: pointer; text-transform: uppercase; font-family: 'Inter', sans-serif; }

        .chart-wrap { position: relative; }
        @media print {
            .section-nav, .report-footer-bar { display: none !important; }
            .report-shell { margin: 0; padding: 0; max-width: 100%; }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="/static/img/SCOE_logo.png" alt="ScoePsychometrics Logo" class="nav-logo">
            <span class="logo">ScoePsychometrics</span>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/exam">Exam</a></li>
            </ul>
        </nav>
    </header>

    <nav class="section-nav">
        <a href="#sec-overview" class="active">Overview</a>
        <a href="#sec-big5">Big Five</a>
        <a href="#sec-mbti">MBTI</a>
        <a href="#sec-temperament">Temperament</a>
        <a href="#sec-mi">Multiple Intelligences</a>
        <a href="#sec-learning">Learning Styles</a>
        <a href="#sec-brain">Brain</a>
        <a href="#sec-enneagram">Enneagram</a>
        <a href="#sec-insights">Insights</a>
    </nav>

    <main class="report-shell" id="report-root">
        <div style="text-align:center;padding:5rem;"><p>Loading sample report...</p></div>
    </main>

    <script>
        async function loadReport() {
            const res = await fetch('/static/data/sample_report_data.json');
            const D = await res.json();
            renderReport(D);
        }

        function levelClass(l) { return (l || 'moderate').replace(/\s+/g, '-').toLowerCase(); }

        function renderReport(D) {
            const root = document.getElementById('report-root');
            const meta = D.meta;
            const sub = D.subtests;
            const ins = D.composite_insights;
            let html = '';

            // COVER
            html += `
            <div class="report-cover" id="sec-overview">
                <div class="cover-badge">Sample Psychometric Assessment Report</div>
                <h1 class="cover-title">${meta.candidate.name.toUpperCase()}</h1>
                <div class="cover-subtitle">Comprehensive Multi-Dimensional Personality &amp; Intelligence Profile</div>
                <div class="cover-meta">
                    <div class="cover-meta-item"><span class="cover-meta-label">Report ID</span><span class="cover-meta-value">${meta.report_id}</span></div>
                    <div class="cover-meta-item"><span class="cover-meta-label">Generated</span><span class="cover-meta-value">${new Date(meta.generated_at).toLocaleDateString('en-IN', {year:'numeric',month:'long',day:'numeric'})}</span></div>
                    <div class="cover-meta-item"><span class="cover-meta-label">Duration</span><span class="cover-meta-value">${Math.floor(meta.quiz_duration_seconds/60)}m ${meta.quiz_duration_seconds%60}s</span></div>
                    <div class="cover-meta-item"><span class="cover-meta-label">Questions</span><span class="cover-meta-value">${meta.total_questions_answered}</span></div>
                    <div class="cover-meta-item"><span class="cover-meta-label">Education</span><span class="cover-meta-value">${meta.candidate.education}</span></div>
                </div>
            </div>`;

            // SNAPSHOT
            const mbti = sub.mbti; const en = sub.enneagram; const bh = sub.brain_hemispheres; const temp = sub.temperament;
            html += `
            <div class="snapshot-grid">
                <div class="snap-card"><div class="snap-label">MBTI Type</div><div class="snap-value">${mbti.result_type}</div><div class="snap-sub">${mbti.type_label}</div></div>
                <div class="snap-card"><div class="snap-label">Enneagram</div><div class="snap-value">Type ${en.primary_type.number}</div><div class="snap-sub">${en.primary_type.wing_label}</div></div>
                <div class="snap-card"><div class="snap-label">Temperament</div><div class="snap-value">${temp.blend_label}</div><div class="snap-sub">Primary: ${temp.primary.charAt(0).toUpperCase()+temp.primary.slice(1)}</div></div>
                <div class="snap-card"><div class="snap-label">Brain Dominance</div><div class="snap-value">${bh.scores.left.percentage}% L</div><div class="snap-sub">${bh.dominant_hemisphere==='left'?'Left-Brain Dominant':'Right-Brain Dominant'}</div></div>
            </div>`;

            // SECTION 1: BIG FIVE
            const b5 = sub.big_five;
            let b5Bars = Object.entries(b5.traits).map(([k,t]) => `
                <li class="hbar-item">
                    <div class="hbar-info"><span>${t.label} <span class="level-badge ${levelClass(t.level)}">${t.level}</span></span><span>${t.score}%</span></div>
                    <div class="hbar-track"><div class="hbar-fill" data-target="${t.score}"></div></div>
                    <span class="hbar-tag">${t.percentile}th percentile</span>
                </li>`).join('');
            html += `
            <div class="section-block" id="sec-big5">
                <div class="section-heading"><span class="section-num">01</span><h2>${b5.label}</h2></div>
                <div class="section-desc">${b5.description}</div>
                <div style="display:grid;grid-template-columns:280px 1fr;gap:2.5rem;align-items:start;">
                    <div style="max-width:280px;"><canvas id="chart-big5"></canvas></div>
                    <ul class="hbar-list">${b5Bars}</ul>
                </div>
                ${Object.entries(b5.traits).map(([k,t])=>`<div class="interp-box" style="margin-top:1rem"><strong>${t.label}</strong>${t.interpretation}</div>`).join('')}
            </div>`;

            // SECTION 2: MBTI
            const dichRows = Object.values(mbti.dichotomies).map(d => `
                <div class="dichotomy-row">
                    <div class="dich-label">${d.dimension_a.label} (${d.dimension_a.code})</div>
                    <div class="dich-bar-wrap">
                        <div class="dich-bar-a" style="width:${d.dimension_a.score}%">${d.dimension_a.score}%</div>
                        <div class="dich-bar-b">${d.dimension_b.score}%</div>
                    </div>
                    <div class="dich-label-right">${d.dimension_b.label} (${d.dimension_b.code})</div>
                </div>`).join('');
            const cogCards = ['dominant','auxiliary','tertiary','inferior'].map(r => {
                const fn = mbti.cognitive_functions[r];
                return `<div class="cog-card"><div class="cog-role">${r}</div><div class="cog-code">${fn.code}</div><div class="cog-name">${fn.label}</div><div class="cog-strength">${fn.strength}%</div></div>`;
            }).join('');
            html += `
            <div class="section-block" id="sec-mbti">
                <div class="section-heading"><span class="section-num">02</span><h2>${mbti.label}</h2></div>
                <div class="section-desc">${mbti.description}</div>
                <div class="mbti-type-display"><div class="mbti-type-code">${mbti.result_type}</div><div class="mbti-type-name">${mbti.type_label}</div></div>
                ${dichRows}
                <div style="margin-top:2rem;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;color:#888;margin-bottom:1rem;">Cognitive Function Stack</div>
                <div class="cog-stack">${cogCards}</div>
                <div class="interp-box"><strong>Interpretation</strong>${mbti.interpretation}</div>
            </div>`;

            // SECTION 3: TEMPERAMENT
            const tempCards = Object.entries(temp.scores).map(([k,v]) => `
                <div class="temp-trait-card"><div class="temp-trait-name">${v.label} — ${v.percentage}%</div><div>${v.traits.map(t=>`<span class="temp-tag">${t}</span>`).join('')}</div></div>`).join('');
            html += `
            <div class="section-block" id="sec-temperament">
                <div class="section-heading"><span class="section-num">03</span><h2>${temp.label}</h2></div>
                <div class="section-desc">${temp.description}</div>
                <div class="temp-blend"><div class="temp-blend-label">${temp.blend_label}</div></div>
                <div style="display:grid;grid-template-columns:220px 1fr;gap:2.5rem;align-items:start;">
                    <div style="max-width:220px;"><canvas id="chart-temp"></canvas></div>
                    <div class="temp-traits-grid">${tempCards}</div>
                </div>
                <div class="interp-box"><strong>Interpretation</strong>${temp.interpretation}</div>
            </div>`;

            // SECTION 4: MULTIPLE INTELLIGENCES
            const mi = sub.multiple_intelligences;
            const miBars = Object.entries(mi.intelligences).map(([k,i]) => `
                <li class="hbar-item">
                    <div class="hbar-info"><span>${i.label} <span class="level-badge ${levelClass(i.level)}">${i.level}</span></span><span>${i.score}%</span></div>
                    <div class="hbar-track"><div class="hbar-fill" data-target="${i.score}" style="background:var(--c-blue)"></div></div>
                    <span class="hbar-tag">${i.percentile}th percentile · ${i.career_hints.join(', ')}</span>
                </li>`).join('');
            html += `
            <div class="section-block" id="sec-mi">
                <div class="section-heading"><span class="section-num">04</span><h2>${mi.label}</h2></div>
                <div class="section-desc">${mi.description}</div>
                <div style="display:grid;grid-template-columns:320px 1fr;gap:2.5rem;align-items:start;">
                    <div style="max-width:320px;"><canvas id="chart-mi"></canvas></div>
                    <ul class="hbar-list">${miBars}</ul>
                </div>
            </div>`;

            // SECTION 5: LEARNING STYLES
            const ls = sub.learning_styles;
            const lsCards = Object.entries(ls.styles).map(([k,s]) => `
                <div class="ls-card ${k===ls.primary_style?'primary':''}">
                    <div class="ls-label">${k===ls.primary_style?'★ Primary':k===ls.secondary_style?'● Secondary':''} ${s.label}</div>
                    <div class="ls-pct">${s.percentage}%</div>
                    <div class="ls-tips">${s.study_tips.map(t=>`<div>→ ${t}</div>`).join('')}</div>
                </div>`).join('');
            html += `
            <div class="section-block" id="sec-learning">
                <div class="section-heading"><span class="section-num">05</span><h2>${ls.label}</h2></div>
                <div class="section-desc">${ls.description}</div>
                <div style="display:grid;grid-template-columns:200px 1fr;gap:2.5rem;align-items:start;">
                    <div style="max-width:200px;"><canvas id="chart-ls"></canvas></div>
                    <div class="ls-grid">${lsCards}</div>
                </div>
                <div class="interp-box"><strong>Interpretation</strong>${ls.interpretation}</div>
            </div>`;

            // SECTION 6: BRAIN HEMISPHERES
            html += `
            <div class="section-block" id="sec-brain">
                <div class="section-heading"><span class="section-num">06</span><h2>${bh.label}</h2></div>
                <div class="section-desc">${bh.description}</div>
                <div class="brain-display">
                    <div>
                        <div style="font-size:0.7rem;text-transform:uppercase;font-weight:700;color:#888;margin-bottom:0.5rem;">Left Hemisphere</div>
                        <div class="brain-pct">${bh.scores.left.percentage}%</div>
                        <div>${bh.scores.left.associated_traits.map(t=>`<span class="brain-trait-tag">${t}</span>`).join('')}</div>
                        <ul style="margin-top:1rem;padding-left:1rem;font-size:0.8rem;color:#555;">${bh.scores.left.strengths.map(s=>`<li style="margin-bottom:0.3rem">${s}</li>`).join('')}</ul>
                    </div>
                    <div class="brain-center">BRAIN</div>
                    <div style="text-align:right;">
                        <div style="font-size:0.7rem;text-transform:uppercase;font-weight:700;color:#888;margin-bottom:0.5rem;">Right Hemisphere</div>
                        <div class="brain-pct">${bh.scores.right.percentage}%</div>
                        <div style="display:flex;flex-wrap:wrap;justify-content:flex-end;">${bh.scores.right.associated_traits.map(t=>`<span class="brain-trait-tag">${t}</span>`).join('')}</div>
                        <ul style="margin-top:1rem;padding-left:1rem;font-size:0.8rem;color:#555;text-align:left;">${bh.scores.right.strengths.map(s=>`<li style="margin-bottom:0.3rem">${s}</li>`).join('')}</ul>
                    </div>
                </div>
                <div class="interp-box"><strong>Interpretation</strong>${bh.interpretation}</div>
            </div>`;

            // SECTION 7: ENNEAGRAM
            html += `
            <div class="section-block" id="sec-enneagram">
                <div class="section-heading"><span class="section-num">07</span><h2>${en.label}</h2></div>
                <div class="section-desc">${en.description}</div>
                <div class="ennea-hero">
                    <div class="ennea-type-num">${en.primary_type.number}</div>
                    <div class="ennea-type-name">${en.primary_type.label}</div>
                    <div class="ennea-wing">Wing: ${en.primary_type.wing} — ${en.primary_type.wing_label}</div>
                </div>
                <div class="ennea-meta-grid">
                    <div class="ennea-meta-card"><div class="ennea-meta-label">Tritype</div><div class="ennea-meta-value">${en.tritype}</div></div>
                    <div class="ennea-meta-card"><div class="ennea-meta-label">Instinctual Variant</div><div class="ennea-meta-value">${en.instinctual_variant.label}</div></div>
                    <div class="ennea-meta-card"><div class="ennea-meta-label">Center</div><div class="ennea-meta-value">${en.center.label}</div></div>
                </div>
                <div class="chart-wrap" style="max-width:320px;margin-bottom:2rem;"><canvas id="chart-ennea"></canvas></div>
                <div class="ennea-directions">
                    <div class="dir-card growth">
                        <div class="dir-label">↑ Growth</div>
                        <div class="dir-type">Type ${en.integration_direction.growth.type} — ${en.integration_direction.growth.label}</div>
                        <div class="dir-desc">${en.integration_direction.growth.description}</div>
                    </div>
                    <div class="dir-card stress">
                        <div class="dir-label">↓ Stress</div>
                        <div class="dir-type">Type ${en.integration_direction.stress.type} — ${en.integration_direction.stress.label}</div>
                        <div class="dir-desc">${en.integration_direction.stress.description}</div>
                    </div>
                </div>
                <div class="interp-box"><strong>Interpretation</strong>${en.interpretation}</div>
            </div>`;

            // COMPOSITE INSIGHTS
            html += `
            <div class="insights-block" id="sec-insights">
                <h2>Composite Insights</h2>
                <div class="insights-summary">${ins.personality_summary}</div>
                <div class="insights-columns">
                    <div class="insight-col">
                        <h3>Top Strengths</h3>
                        <ul>${ins.top_strengths.map(s=>`<li>${s}</li>`).join('')}</ul>
                    </div>
                    <div class="insight-col">
                        <h3>Growth Areas</h3>
                        <ul>${ins.growth_areas.map(g=>`<li>${g}</li>`).join('')}</ul>
                    </div>
                </div>
                <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;color:#888;margin-bottom:0.8rem;">Recommended Career Domains</div>
                <div class="career-tags">${ins.recommended_career_domains.map(c=>`<span class="career-tag">${c}</span>`).join('')}</div>
                <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;color:#888;margin-top:2rem;margin-bottom:0.8rem;">Workplace Compatibility</div>
                <div class="compat-grid">
                    <div class="compat-card"><div class="compat-label">Work Environment</div><div class="compat-value">${ins.compatibility_notes.work_environment}</div></div>
                    <div class="compat-card"><div class="compat-label">Team Role</div><div class="compat-value">${ins.compatibility_notes.team_role}</div></div>
                    <div class="compat-card"><div class="compat-label">Leadership Style</div><div class="compat-value">${ins.compatibility_notes.leadership_style}</div></div>
                </div>
            </div>`;

            html += `
            <div class="report-footer-bar">
                <span>Report ID: ${meta.report_id}</span>
                <span>Version ${meta.version} · ${meta.total_questions_answered} Questions · Sample Report</span>
                <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
            </div>`;

            root.innerHTML = html;
            renderCharts(D);
            setTimeout(() => document.querySelectorAll('.hbar-fill[data-target]').forEach(b => b.style.width = b.dataset.target + '%'), 300);
        }

        function renderCharts(D) {
            const sub = D.subtests;
            const C = { green:'#2ecc71', red:'#e74c3c', blue:'#3498db', yellow:'#f1c40f', purple:'#9b59b6', orange:'#e67e22', teal:'#1abc9c', pink:'#e91e63' };

            // Big Five Radar
            const b5 = sub.big_five.traits;
            new Chart(document.getElementById('chart-big5'), {
                type: 'radar',
                data: {
                    labels: Object.values(b5).map(t => t.label.replace('Openness to Experience','Openness').replace('Conscientiousness','Conscient.')),
                    datasets: [{
                        data: Object.values(b5).map(t => t.score),
                        backgroundColor: 'rgba(26,188,156,0.15)',
                        borderColor: C.teal, borderWidth: 2,
                        pointBackgroundColor: [C.green,C.blue,C.orange,C.teal,C.red],
                        pointRadius: 4, pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    layout: { padding: 10 },
                    scales: { r: { beginAtZero: true, max: 100, ticks: { display: false, stepSize: 25 }, grid: { color: '#e8e8e8' }, angleLines: { color: '#e8e8e8' }, pointLabels: { font: { size: 10, weight: '700' }, padding: 12 } } },
                    plugins: { legend: { display: false } }
                }
            });

            // Temperament Doughnut
            const ts = sub.temperament.scores;
            new Chart(document.getElementById('chart-temp'), {
                type: 'doughnut',
                data: { labels: Object.values(ts).map(t=>t.label), datasets:[{ data: Object.values(ts).map(t=>t.percentage), backgroundColor:[C.yellow,C.red,C.purple,C.blue], borderWidth: 2, borderColor:'#fff' }] },
                options: { responsive: true, maintainAspectRatio: true, cutout: '55%', plugins: { legend: { position: 'bottom', labels: { font: { size: 9, weight: '700' }, padding: 10, usePointStyle: true, boxWidth: 8 } } } }
            });

            // MI Horizontal Bar
            const mi = sub.multiple_intelligences.intelligences;
            new Chart(document.getElementById('chart-mi'), {
                type: 'bar',
                data: { labels: Object.values(mi).map(i=>i.label.replace(' Intelligence','').replace('Logical-Mathematical','Logic-Math').replace('Visual-Spatial','Visual').replace('Bodily-Kinesthetic','Kinesthetic')), datasets:[{ data: Object.values(mi).map(i=>i.score), backgroundColor:[C.blue,C.green,C.purple,C.orange,C.teal,C.red], borderWidth:0, barThickness: 16, borderRadius: 3 }] },
                options: { responsive: true, maintainAspectRatio: true, indexAxis: 'y', scales: { x: { beginAtZero:true, max:100, grid:{color:'#eee'}, ticks:{font:{size:9,weight:'700'}} }, y: { grid:{display:false}, ticks:{font:{size:9,weight:'700'}} } }, plugins: { legend: { display: false } } }
            });

            // Learning Styles Pie
            const ls = sub.learning_styles.styles;
            new Chart(document.getElementById('chart-ls'), {
                type: 'pie',
                data: { labels: Object.values(ls).map(s=>s.label), datasets:[{ data: Object.values(ls).map(s=>s.percentage), backgroundColor:[C.blue,C.orange,C.green,C.yellow], borderWidth: 2, borderColor:'#fff' }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 8, weight: '700' }, padding: 8, usePointStyle: true, boxWidth: 8 } } } }
            });

            // Enneagram Radar
            const ens = sub.enneagram.type_scores;
            new Chart(document.getElementById('chart-ennea'), {
                type: 'radar',
                data: {
                    labels: Object.values(ens).map(t => t.label.replace('The ','')),
                    datasets: [{
                        data: Object.values(ens).map(t=>t.score),
                        backgroundColor: 'rgba(155,89,182,0.12)',
                        borderColor: C.purple, borderWidth: 2,
                        pointBackgroundColor: Object.values(ens).map((_,i)=>[C.red,C.orange,C.yellow,C.purple,C.blue,C.green,C.teal,C.pink,C.green][i]),
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    layout: { padding: 5 },
                    scales: { r: { beginAtZero: true, max: 100, ticks: { display: false }, grid: { color: '#e0e0e0' }, angleLines: { color: '#e0e0e0' }, pointLabels: { font: { size: 9, weight: '600' }, padding: 8 } } },
                    plugins: { legend: { display: false } }
                }
            });

            // Scroll spy
            const navLinks = document.querySelectorAll('.section-nav a');
            window.addEventListener('scroll', () => {
                let cur = '';
                document.querySelectorAll('[id^="sec-"]').forEach(s => { if (window.scrollY >= s.offsetTop - 160) cur = s.id; });
                navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#'+cur));
            });
        }

        loadReport();
    </script>
</body>
</html>
